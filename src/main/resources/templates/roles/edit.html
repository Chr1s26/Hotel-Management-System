<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Role</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/form-theme.css}">
</head>
<body class="royal-form-page">
<div class="container mt-4">
    <h2>Edit Role</h2>

    <form th:action="@{/roles/update/{id}(id=${role.id})}" th:object="${role}" method="post" class="needs-validation">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Role Name</label>
            <input type="text" th:field="*{roleName}" class="form-control" placeholder="e.g., ADMIN"/>
            <div class="text-danger" th:if="${#fields.hasErrors('roleName')}" th:errors="*{roleName}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Update Role</button>
        <a class="btn btn-secondary" th:href="@{/roles}">Cancel</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
