<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Error</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

<div class="card text-center shadow p-4" style="max-width: 500px;">
  <div class="card-body">
    <h2 class="card-title text-danger" th:text="${errorTitle}">Something went wrong</h2>

    <p class="card-text" th:if="${errorMessage}">
      <strong th:text="${errorMessage}">Error message here</strong>
    </p>

    <p class="text-muted" th:if="${requestURI}">
      <small th:text="'Requested Path: ' + ${requestURI}">/some-path</small>
    </p>

    <a onclick="history.back()" class="btn btn-primary mt-3">Go Back</a>
  </div>
</div>

</body>
</html>
