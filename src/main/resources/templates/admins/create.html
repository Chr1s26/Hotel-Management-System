<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Admin</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
          rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/form-theme.css}">
</head>

<body class="royal-form-page">
<div class="container mt-4">
    <h2 class="page-title">Create Admin</h2>

    <div class="alert alert-danger"
         th:if="${globalError}"
         th:text="${globalError}">
    </div>


    <form th:action="@{/admins/create}" th:object="${admin}" method="post" class="needs-validation glass-form">

        <div class="accordion royal-accordion" id="adminAccordion">
            <!-- Basic Information Section -->
            <div class="accordion-item">
                <h2 class="accordion-header" id="headingBasic">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse"
                            data-bs-target="#collapseBasic" aria-expanded="true"
                            aria-controls="collapseBasic">
                        Basic Information
                    </button>
                </h2>
                <div id="collapseBasic"
                     class="accordion-collapse collapse show"
                     aria-labelledby="headingBasic"
                     data-bs-parent="#adminAccordion">
                    <div class="accordion-body">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" th:field="*{name}" class="form-control"
                                   placeholder="Enter name">
                            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" th:field="*{phone}" class="form-control"
                                   placeholder="Enter phone number">
                            <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Date of Birth</label>
                            <input type="date" th:field="*{dateOfBirth}" class="form-control">
                            <div class="text-danger" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nationality</label>
                            <input type="text" th:field="*{nationality}" class="form-control"
                                   placeholder="Enter nationality">
                            <div class="text-danger" th:if="${#fields.hasErrors('nationality')}" th:errors="*{nationality}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Identification Section -->
            <div class="accordion-item">
                <h2 class="accordion-header" id="headingIdentification">
                    <button class="accordion-button collapsed" type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#collapseIdentification"
                            aria-expanded="false"
                            aria-controls="collapseIdentification">
                        Identification Details
                    </button>
                </h2>
                <div id="collapseIdentification"
                     class="accordion-collapse collapse"
                     aria-labelledby="headingIdentification"
                     data-bs-parent="#adminAccordion">
                    <div class="accordion-body">
                        <div class="mb-3">
                            <label class="form-label">Passport Number</label>
                            <input type="text" th:field="*{passportNumber}" class="form-control"
                                   placeholder="Enter passport number">
                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('passportNumber')}"
                                 th:errors="*{passportNumber}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">National ID Number</label>
                            <input type="text" th:field="*{nationalIdNumber}" class="form-control"
                                   placeholder="Enter national ID number">
                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('nationalIdNumber')}"
                                 th:errors="*{nationalIdNumber}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Admin Type Section -->
            <div class="accordion-item">
                <h2 class="accordion-header" id="headingType">
                    <button class="accordion-button collapsed" type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#collapseType"
                            aria-expanded="false"
                            aria-controls="collapseType">
                        Admin Type
                    </button>
                </h2>
                <div id="collapseType"
                     class="accordion-collapse collapse"
                     aria-labelledby="headingType"
                     data-bs-parent="#adminAccordion">
                    <div class="accordion-body">
                        <div class="mb-3">
                            <label class="form-label">Admin Type</label>
                            <select th:field="*{adminType}" class="form-select">
                                <option value="">-- Select Admin Type --</option>
                                <option th:each="type : ${T(com.project.HotelManagementSystem.entity.constants.AdminType).values()}"
                                        th:value="${type}"
                                        th:text="${type}"></option>
                            </select>
                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('adminType')}"
                                 th:errors="*{adminType}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">User Account</label>
                            <select th:field="*{user}" class="form-select">
                                <option value="">-- Select User --</option>
                                <option th:each="user : ${users}"
                                        th:value="${user.id}"
                                        th:text="${user.name + ' (' + user.email + ')'}"></option>
                            </select>
                            <div class="text-danger" th:if="${#fields.hasErrors('user')}" th:errors="*{user}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Buttons -->
        <div class="mt-4 text-center">
            <button type="submit" class="btn btn-primary me-2">Save</button>
            <a class="btn btn-secondary" th:href="@{/admins}">Cancel</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
    $(document).ready(function() {
        // Initialize Select2 (if used)
        $('select').select2();
    });
</script>
</body>
</html>
