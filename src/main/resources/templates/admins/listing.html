<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admins</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #2E4053;
            color: white;
            padding-top: 70px;
        }

        h2 {
            text-align: center;
            padding-top: 30px;
        }

        table {
            background-color: #3A3A3A;
            color: white;
        }

        thead th {
            background-color: #3A3A3A !important;
            color: white !important;
        }

        tbody td {
            background-color: #5A5A5A !important;
            color: white !important;
        }

        th, td {
            text-align: center;
            vertical-align: middle;
        }

        .table-bordered {
            border: 1px solid #999;
        }

        .btn-warning {
            background-color: #ffc107;
            color: black;
            border: none;
        }

        .btn-warning:hover {
            background-color: #e0a800;
        }

        .btn-danger {
            background-color: #dc3545;
            border: none;
        }

        .btn-danger:hover {
            background-color: #bb2d3b;
        }

        .btn-primary {
            background-color: #555555;
            border-color: #555555;
            color: white;
        }

        .btn-primary:hover {
            background-color: #777777;
            border-color: #777777;
            color: white;
        }

        .container {
            padding-top: 20px;
        }

        .pagination .page-item.active .page-link {
            background-color: #6c757d;
            color: white;
            border-color: #6c757d;
        }

        .pagination .page-link {
            color: #6c757d;
            background-color: transparent;
            border: 1px solid transparent;
        }

        .pagination .page-link:hover {
            background-color: #5a6268;
            color: white;
            border-color: #5a6268;
        }

        .pagination .page-item.disabled .page-link {
            color: #adb5bd;
            pointer-events: none;
            background-color: transparent;
            border-color: transparent;
        }

        .form-label, .form-select {
            color: white;
        }

        #pageSize {
            background-color: #3A3A3A;
            color: white;
            border: 1px solid #ccc;
        }

        #pageSize option {
            background-color: #2E4053;
            color: white;
        }

        .type-badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            margin: 0.1rem 0;
            border-radius: 0.25rem;
            background: #2E4053;
            border: 1px solid #6c757d;
            font-size: 0.85rem;
        }

        .navbar { z-index: 1050 !important; }

        .dropdown-menu { z-index: 2000 !important; }
    </style>
</head>
<body class="container mt-4">
<div th:replace="fragments/navbar :: navbar"></div>

<h2>Admins</h2>

<div class="d-flex justify-content-between align-items-center my-3">
    <div>
        Page <span th:text="${response.pageNumber + 1}">1</span> of
        <span th:text="${response.totalPages}">X</span> —
        Total: <span th:text="${response.totalElements}">Y</span> admins
    </div>

    <div>
        <a class="btn btn-primary btn-lg" th:href="@{/admins/new}">Add Admin</a>
    </div>
</div>

<table class="table table-bordered">
    <thead>
    <tr>
        <th>ID</th>
        <th>NAME</th>
        <th>PHONE</th>
        <th>DATE OF BIRTH</th>
        <th>NATIONALITY</th>
        <th>IDENTIFICATION</th>
        <th>ADMIN TYPE</th>
        <th>STATUS</th>
        <th>CREATED AT</th>
        <th>UPDATED AT</th>
        <th>ACTIONS</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="admin : ${admins}">
        <td th:text="${admin.id}">1</td>
        <td th:text="${admin.name}">John Doe</td>
        <td th:text="${admin.phone}">+123456789</td>
        <td th:text="${admin.dateOfBirth != null ? #temporals.format(admin.dateOfBirth, 'yyyy-MM-dd') : '—'}">—</td>
        <td th:text="${admin.nationality}">American</td>
        <td>
            <div th:if="${admin.passportNumber != null || admin.nationalIdNumber != null}">
                <div th:if="${admin.passportNumber != null}" class="type-badge">Passport: <span th:text="${admin.passportNumber}">AB123456</span></div>
                <div th:if="${admin.nationalIdNumber != null}" class="type-badge">National ID: <span th:text="${admin.nationalIdNumber}">123456789</span></div>
            </div>
            <div th:if="${admin.passportNumber == null && admin.nationalIdNumber == null}">—</div>
        </td>
        <td>
            <div class="type-badge" th:text="${admin.adminType}">ADMIN</div>
        </td>
        <td th:text="${admin.status}">ACTIVE</td>
        <td th:text="${admin.createdAt != null ? #temporals.format(admin.createdAt, 'yyyy-MM-dd HH:mm') : '—'}">—</td>
        <td th:text="${admin.updatedAt != null ? #temporals.format(admin.updatedAt, 'yyyy-MM-dd HH:mm') : '—'}">—</td>
        <td>
            <a class="btn btn-sm btn-warning" th:href="@{'/admins/edit/' + ${admin.id}}">Edit</a>
            <a class="btn btn-sm btn-danger" th:href="@{'/admins/delete/' + ${admin.id}}">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

<form th:action="@{/admins}" method="get" class="row align-items-center justify-content-between mt-4 mb-3">
    <!-- Page size selector -->
    <div class="col-md-4">
        <label for="pageSize" class="form-label">Show</label>
        <select id="pageSize" class="form-select d-inline w-auto" name="pageSize" onchange="this.form.submit()">
            <option th:value="3" th:selected="${response.pageSize == 3}">3</option>
            <option th:value="6" th:selected="${response.pageSize == 6}">6</option>
            <option th:value="9" th:selected="${response.pageSize == 9}">9</option>
        </select>
        <span>per page</span>

        <!-- Hidden inputs -->
        <input type="hidden" name="pageNumber" th:value="${response.pageNumber}" />
        <input type="hidden" name="sortBy" th:value="${sortBy}" />
        <input type="hidden" name="sortOrder" th:value="${sortOrder}" />
    </div>

    <!-- Pagination links -->
    <div class="col-md-8 text-end">
        <nav class="d-flex justify-content-end mt-2">
            <ul class="pagination">
                <li class="page-item" th:classappend="${response.pageNumber == 0} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/admins(pageNumber=${response.pageNumber - 1}, pageSize=${response.pageSize}, sortBy=${sortBy}, sortOrder=${sortOrder})}">Previous</a>
                </li>

                <li class="page-item" th:each="i : ${#numbers.sequence(0, response.totalPages - 1)}"
                    th:classappend="${i == response.pageNumber} ? 'active'">
                    <a class="page-link"
                       th:href="@{/admins(pageNumber=${i}, pageSize=${response.pageSize}, sortBy=${sortBy}, sortOrder=${sortOrder})}"
                       th:text="${i + 1}">1</a>
                </li>

                <li class="page-item" th:classappend="${response.pageNumber + 1 >= response.totalPages} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/admins(pageNumber=${response.pageNumber + 1}, pageSize=${response.pageSize}, sortBy=${sortBy}, sortOrder=${sortOrder})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>
</form>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
