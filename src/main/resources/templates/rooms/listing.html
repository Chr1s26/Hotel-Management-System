<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Room List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/form-theme.css}">
</head>
<body class="royal-form-page">
<div th:replace="fragments/sidebar :: sidebar"></div>
<div class="container mt-4">
    <h2>Rooms</h2>

    <form th:action="@{/rooms}" th:object="${query}" method="post" class="row g-3 align-items-end mb-4 no-card">

        <div class="col-md-3">
            <label for="searchPrice" class="form-label">Price</label>
            <input type="hidden" th:name="*{filterList[0].field}" th:value="'PRICE'">
            <input type="hidden" th:name="*{filterList[0].matchType}" th:value="'EXACT'">
            <input type="text" id="searchPrice" name="price" class="form-control" th:field="*{filterList[0].value}" placeholder="Search by price">
        </div>

        <div class="col-md-3">
            <label for="searchAvailable" class="form-label">Is Available</label>
            <input type="hidden" th:name="*{filterList[1].field}" th:value="'IS_AVAILABLE'">
            <input type="hidden" th:name="*{filterList[1].matchType}" th:value="'EXACT'">
            <select id="searchAvailable" name="isAvailable" th:field="*{filterList[1].value}" class="form-select">
                <option th:value="${null}">-- Select --</option>
                <option th:value="true" th:text="'Yes'"></option>
                <option th:value="false" th:text="'No'"></option>
            </select>
        </div>

        <div class="col-md-3">
            <label for="searchStatus" class="form-label">Status</label>
            <input type="hidden" th:name="*{filterList[2].field}" th:value="'STATUS'">
            <input type="hidden" th:name="*{filterList[2].matchType}" th:value="'EXACT'">
            <select th:field="*{filterList[2].value}" id="searchStatus" name="statusType" class="form-select">
                <option value="">All</option>
                <option value="ACTIVE">ACTIVE</option>
                <option value="DELETED">DELETED</option>
            </select>
        </div>

        <div class="col-md-3">
            <label class="form-label">Room Type</label>
            <input type="text"
                   th:field="*{filterList[3].value}"
                   class="form-control"
                   placeholder="e.g. Double, Family">
        </div>

        <div class="col-md-3">
            <label class="form-label">Room Size (people)</label>
            <input type="number"
                   th:field="*{filterList[4].value}"
                   class="form-control">
        </div>

        <div class="col-md-3">
            <label class="form-label">Capacity (rooms)</label>
            <input type="number"
                   th:field="*{filterList[5].value}"
                   class="form-control">
        </div>

        <div class="col-md-3">
            <label class="form-label">Sort By</label>
            <select th:field="*{sortBy}" class="form-select" >
                <option value="name">Name</option>
                <option value="createdAt">Created Date</option>
            </select>
        </div>

        <div class="col-md-3">
            <label class="form-label">Order</label>
            <select th:field="*{sortDirection}" class="form-select">
                <option value="ASC">Ascending</option>
                <option value="DESC">Descending</option>
            </select>
        </div>

        <div class="col-md-3 d-flex align-items-end">
            <button type="submit" class="btn btn-primary me-2">Search</button>
            <a th:href="@{/rooms}" class="btn btn-secondary">Reset</a>
        </div>
    </form>

    <div th:if="${exportError}" class="alert alert-danger mt-2">
        <span th:text="${exportError}"></span>
    </div>

    <form th:action="@{/rooms/export/excel}" th:object="${query}" method="post" style="all: unset; display: inline;">
        <input type="hidden" th:each="f, iStat : ${query.filterList}"
               th:name="|filterList[${iStat.index}].field|" th:value="${f.field}">
        <input type="hidden" th:each="f, iStat : ${query.filterList}"
               th:name="|filterList[${iStat.index}].matchType|" th:value="${f.matchType}">
        <input type="hidden" th:each="f, iStat : ${query.filterList}"
               th:name="|filterList[${iStat.index}].value|" th:value="${f.value}">

        <!-- Sort info -->
        <input type="hidden" th:field="*{sortBy}">
        <input type="hidden" th:field="*{sortDirection}">

        <button type="submit" class="btn btn-success mb-3">
            <i class="bi bi-file-earmark-excel"></i> Export to Excel
        </button>
    </form>

    <div class="d-flex justify-content-between align-items-center my-3">
        <div>
            Page <span th:text="${query.pageNumber + 1}">1</span> of
            <span th:text="${totalPages}">X</span> —
            Total: <span th:text="${totalElements}">Y</span> rooms
        </div>


        <div>
            <a class="btn btn-primary btn-lg" th:href="@{/rooms/new}">Add Rooms</a>
        </div>
    </div>

    <table class="table table-bordered">
        <thead>
        <tr><th>ID</th><th>Price</th><th>Is Available</th><th>Description</th><th>Room Type</th><th>Room Size</th><th>Max Capacity</th><th>Hotel</th><th>Amenities</th><th>Promotion</th><th>ACTIONS</th></tr>
        </thead>
        <tbody>
        <tr th:each="room : ${rooms}">
            <td th:text="${room.id}"></td>
            <td th:text="${room.price}"></td>
            <td th:text="${room.isAvailable}"></td>
            <td th:text="${room.description}"></td>
            <td th:text="${room.roomTypeName}"></td>
            <td th:text="${room.roomSize + ' m²'}"></td>
            <td th:text="${room.capacity}"></td>

            <td th:text="${room.hotel != null ? room.hotel.name : '-'}"></td>
            <td>
                <ul class="list-unstyled mb-0" th:if="${room.amenities != null}">
                    <li th:each="a : ${room.amenities}" th:text="${a.name}"></li>
                </ul>
            </td>
            <td>
                <ul class="list-unstyled mb-0" th:if="${room.promotions != null}">
                    <li th:each="p : ${room.promotions}" th:text="${p.code}"></li>
                </ul>
            </td>
            <td>
                <a class="btn btn-sm btn-view" th:href="@{'/rooms/view/' + ${room.id}}"> View </a>
                <a class="btn btn-sm btn-warning" th:href="@{'/rooms/edit/' + ${room.id}}">Edit</a>
                <div th:replace="~{fragments/delete-control :: deleteControl('/rooms', ${room.id})}"></div>
            </td>
        </tr>
        </tbody>
    </table>

    <form th:action="@{/rooms}" method="get" class="row align-items-center justify-content-between mt-4 mb-3 no-card">
        <!-- Page size selector -->
        <div class="col-md-4">
            <label for="pageSize" class="form-label">Show</label>
            <select id="pageSize" class="form-select d-inline w-auto" name="pageSize" onchange="this.form.submit()">
                <option th:value="3" th:selected="${query.pageSize == 3}">3</option>
                <option th:value="6" th:selected="${query.pageSize == 6}">6</option>
                <option th:value="9" th:selected="${query.pageSize == 9}">9</option>
            </select>
            <span>per page</span>

            <!-- Hidden inputs -->
            <input type="hidden" name="pageNumber" th:value="${query.pageNumber}" />
            <input type="hidden" name="sortBy" th:value="${query.sortBy}" />
            <input type="hidden" name="sortDirection" th:value="${query.sortDirection}" />
        </div>

        <!-- Pagination links -->
        <div class="col-md-8 text-end">
            <nav class="d-flex justify-content-end mt-2">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${query.pageNumber == 0} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/rooms(pageNumber=${query.pageNumber - 1}, pageSize=${query.pageSize}, sortBy=${query.sortBy}, sortDirection=${query.sortDirection})}">Previous</a>
                    </li>

                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == query.pageNumber} ? 'active'">
                        <a class="page-link"
                           th:href="@{/rooms(pageNumber=${i}, pageSize=${query.pageSize}, sortBy=${query.sortBy}, sortDirection=${query.sortDirection})}"
                           th:text="${i + 1}">1</a>
                    </li>

                    <li class="page-item" th:classappend="${query.pageNumber + 1 >= totalPages} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/rooms(pageNumber=${query.pageNumber + 1}, pageSize=${query.pageSize}, sortBy=${query.sortBy}, sortDirection=${query.sortDirection})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function() {
        const toggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('appSidebar');
        const body = document.querySelector('body');

        if (!sidebar) return;
        const savedState = localStorage.getItem("sidebar-collapsed") === "true";

        function setCollapsed(collapsed) {
            if (collapsed) {
                sidebar.classList.add('sidebar-collapsed');
                body.classList.remove('content-with-sidebar');
                body.classList.add('content-no-sidebar');
            } else {
                sidebar.classList.remove('sidebar-collapsed');
                body.classList.remove('content-no-sidebar');
                body.classList.add('content-with-sidebar');
            }
            try { localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0'); } catch(e) {}
        }

        const saved = localStorage.getItem('sidebarCollapsed');
        setCollapsed(saved === '1');

        if (toggle) {
            toggle.addEventListener('click', function () {
                const isCollapsed = sidebar.classList.contains('sidebar-collapsed');
                setCollapsed(!isCollapsed);
            });
        }

        // close sidebar on small screens when clicking outside
        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 991.98) {
                if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
                    setCollapsed(true);
                }
            }
        });
    })();
</script>
</body>
</html>
