<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Room</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #2E4053; /* Dark gray background */
            color: white;              /* White text globally */
            padding-top: 70px;
        }
        form {
            background-color: #6E6E6E; /* Slightly lighter gray for form background */
            padding: 20px;
            border-radius: 8px;
        }
        label.form-label {
            color: white; /* Ensure labels are white */
        }
        .form-control, .form-select {
            background-color: #7F7F7F; /* Medium gray input background */
            color: white;              /* White text inside inputs */
            border: 1px solid #999;
        }
        .form-control:focus, .form-select:focus {
            background-color: #8F8F8F; /* Slightly lighter on focus */
            color: white;
            border-color: #ccc;
            box-shadow: none;
        }
        .text-danger {
            color: #FF6B6B; /* Keep error text red for visibility */
        }
        .btn-primary {
            background-color: #555555; /* Dark gray button */
            border-color: #555555;
            color: white;
        }
        .btn-primary:hover {
            background-color: #777777;
            border-color: #777777;
            color: white;
        }
        .btn-secondary {
            background-color: #333333; /* Even darker gray */
            border-color: #333333;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #555555;
            border-color: #555555;
            color: white;}

        /* Match form background and white text for single select */
        .select2-container--default .select2-selection--single {
            background-color: #6E6E6E; /* Match form background */
            color: white;
            border: 1px solid #999;
        }

        /* Match form background and white text for multi-select */
        .select2-container--default .select2-selection--multiple {
            background-color: #6E6E6E;
            color: white;
            border: 1px solid #999;
        }

        /* White text inside the dropdown list */
        .select2-container--default .select2-results__option {
            color: white;
            background-color: #6E6E6E;
        }

        /* Highlighted option */
        .select2-container--default .select2-results__option--highlighted[aria-selected] {
            background-color: #7F7F7F;
            color: white;
        }

        /* Placeholder text */
        .select2-container--default .select2-selection--single .select2-selection__placeholder {
            color: black;
            font-weight: bold;
            text-shadow: 0 0 2px #000000;
        }

        /* Tag style for multiple select selections */
        .select2-container--default .select2-selection--multiple .select2-selection__choice {
            background-color: #555555;
            border: none;
            color: white;
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: white !important;          /* Ensure selected text is white */
        }

        /* Selected item in dropdown list (highlighted) */
        .select2-container--default .select2-results__option[aria-selected="true"] {
            background-color: #444444 !important;  /* Slightly different to indicate selection */
            color: white !important;
        }
    </style>
</head>
<body class="container mt-4">
<div th:replace="fragments/navbar :: navbar"></div>
<h2>Create Room</h2>
<form th:action="@{/rooms/create}" th:object="${room}" method="post" class="needs-validation">
    <div class="mb-3">
        <label class="form-label">Price</label>
        <input type="text" th:field="*{price}" class="form-control"/>
        <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
    </div>
    <div class="form-check mb-3">
        <input type="checkbox" th:field="*{available}" class="form-check-input" id="available"/>
        <label class="form-check-label" for="available">Is Available</label>
        <div class="text-danger" th:if="${#fields.hasErrors('available')}" th:errors="*{available}"></div>
    </div>
    <div class="mb-3">
        <label class="form-label">Description</label>
        <input type="text" th:field="*{description}" class="form-control"/>
        <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
    </div>
    <div class="mb-3">
        <label class="form-label">Room Type</label>
        <select th:field="*{roomType}" class="form-select" required>
            <option th:each="r : ${T(com.project.HotelManagementSystem.entity.constants.RoomType).values()}"
                    th:value="${r}"
                    th:text="${r.name()}">Role</option>
        </select>
        <div class="text-danger" th:if="${#fields.hasErrors('roomType')}" th:errors="*{roomType}"></div>
    </div>
    <div class="mb-3">
        <label class="form-label">Max Capacity</label>
        <input type="text" th:field="*{maxCapacity}" class="form-control"/>
        <div class="text-danger" th:if="${#fields.hasErrors('maxCapacity')}" th:errors="*{maxCapacity}"></div>
    </div>
    <div class="mb-3">
        <label class="form-label">Hotel</label>
        <select id="hotel-select" th:field="*{hotel.id}" class="form-select" required>
            <option value="" disabled selected>-- Select Hotel --</option>
            <option th:each="hotel : ${hotels}"
                    th:value="${hotel.id}"
                    th:text="${hotel.name}">
            </option>
        </select>
        <div class="text-danger" th:if="${#fields.hasErrors('hotel')}" th:errors="*{hotel}"></div>
    </div>
    <div class="mb-3">
        <label class="form-label">Amenities</label>
        <select class="form-select" id="amenities-select" th:field="*{amenityIds}" multiple>
            <option th:each="am : ${amenities}"
                    th:value="${am.id}"
                    th:text="${am.name}">
            </option>
        </select>
<!--        <div class="text-danger" th:if="${#fields.hasErrors('amenityIds')}" th:errors="*{amenityIds}"></div>-->
    </div>
    <div class="mb-3">
        <label class="form-label">Promotions</label>
        <select class="form-select" id="promotions-select" th:field="*{promotionIds}" multiple>
            <option th:each="promo : ${promotions}"
                    th:value="${promo.id}"
                    th:text="${promo.code}">
            </option>
        </select>
<!--        <div class="text-danger" th:if="${#fields.hasErrors('promotionIds')}" th:errors="*{promotionIds}"></div>-->
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a class="btn btn-secondary" th:href="@{/rooms}">Cancel</a>
</form>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
    $(document).ready(function() {
        $('#hotel-select').select2({
            placeholder: "Select or type a hotel",
            allowClear: true,
            width: '100%'
        });
    });
    $(document).ready(function() {
        $('#hotel-select').select2({
            placeholder: "Select or type a hotel",
            allowClear: true,
            width: '100%'
        });

        $('#amenities-select').select2({
            placeholder: "Select amenities",
            width: '100%'
        });

        $('#promotions-select').select2({
            placeholder: "Select promotions",
            width: '100%'
        });
    });
</script>
</body>
</html>
