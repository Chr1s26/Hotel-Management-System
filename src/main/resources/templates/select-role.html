<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Select Role | Hotel Management System</title>

    <!-- Tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Your Royal Blue + Glass theme -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="bg-royal-navy-grad min-h-screen flex flex-col items-center justify-center">

<!-- Page Title -->
<h2 class="page-title text-4xl font-extrabold mb-8 text-bluegray">Hotel Management System</h2>

<!-- Card -->
<div class="glass-card p-8 w-full max-w-md">
    <h3 class="card-title text-xl text-center font-semibold mb-4">Select Your Role</h3>

    <p class="text-soft2 text-sm text-center mb-6">
        You have multiple roles. Please choose one to proceed:
    </p>

    <!-- Error Message -->
    <div th:if="${param.error == 'invalid_selection'}"
         class="bg-red-200 bg-opacity-70 border border-red-400 text-red-900 px-4 py-3 rounded mb-4 text-center">
        Invalid role selection.
    </div>

    <!-- Role Selection Form -->
    <form th:action="@{/set-active-role}" method="post" class="space-y-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="space-y-2">
            <div th:each="role : ${userRoles}" class="flex items-center space-x-3">
                <input type="radio"
                       th:id="${role}"
                       name="selectedRole"
                       th:value="${role}"
                       class="h-4 w-4 text-bluegray border-bluegray focus:ring-bluegray"
                       required />
                <label th:for="${role}"
                       th:text="${role.replace('ROLE_', '')}"
                       class="text-soft font-medium capitalize"></label>
            </div>
        </div>

        <button type="submit" class="btn-primary w-full mt-6 py-2.5">
            Continue
        </button>
    </form>

    <p class="mt-6 text-center text-sm text-soft2">
        Not you?
        <a th:href="@{/login}" class="link font-medium">Logout</a>
    </p>
</div>

</body>
</html>
