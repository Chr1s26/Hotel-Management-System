<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Amenities List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/form-theme.css}">
</head>

<body class="royal-form-page">
<div th:replace="fragments/sidebar :: sidebar"></div>
<div class="container mt-4">
    <h2>Amenities</h2>

    <form th:action="@{/amenities}" th:object="${query}" method="post" class="row g-3 align-items-end mb-4 no-card">

        <div class="col-md-3">
            <label for="searchName" class="form-label">Name</label>
            <input type="hidden" th:name="*{filterList[0].field}" th:value="'NAME'">
            <input type="hidden" th:name="*{filterList[0].matchType}" th:value="'CONTAINS'">
            <input type="text" id="searchName" name="name" class="form-control" th:field="*{filterList[0].value}" placeholder="Search by name">
        </div>

        <div class="col-md-3">
            <label for="searchStatus" class="form-label">Status</label>
            <input type="hidden" th:name="*{filterList[1].field}" th:value="'STATUS'">
            <input type="hidden" th:name="*{filterList[1].matchType}" th:value="'EXACT'">
            <select th:field="*{filterList[1].value}" id="searchStatus" name="statusType" class="form-select">
                <option value="">All</option>
                <option value="ACTIVE">ACTIVE</option>
                <option value="DELETED">DELETED</option>
            </select>
        </div>

        <div class="col-md-3">
            <label class="form-label">Sort By</label>
            <select th:field="*{sortBy}" class="form-select" >
                <option value="name">Name</option>
                <option value="createdAt">Created Date</option>
            </select>
        </div>

        <div class="col-md-3">
            <label class="form-label">Order</label>
            <select th:field="*{sortDirection}" class="form-select">
                <option value="ASC">Ascending</option>
                <option value="DESC">Descending</option>
            </select>
        </div>

        <div class="col-md-3 d-flex align-items-end">
            <button type="submit" class="btn btn-primary me-2">Search</button>
            <a th:href="@{/amenities}" class="btn btn-secondary">Reset</a>
        </div>
    </form>

    <div th:if="${exportError}" class="alert alert-danger mt-2">
        <span th:text="${exportError}"></span>
    </div>

    <form th:action="@{/amenities/export/excel}" th:object="${query}" method="post" style="all: unset; display: inline;">
        <input type="hidden" th:each="f, iStat : ${query.filterList}"
               th:name="|filterList[${iStat.index}].field|" th:value="${f.field}">
        <input type="hidden" th:each="f, iStat : ${query.filterList}"
               th:name="|filterList[${iStat.index}].matchType|" th:value="${f.matchType}">
        <input type="hidden" th:each="f, iStat : ${query.filterList}"
               th:name="|filterList[${iStat.index}].value|" th:value="${f.value}">

        <!-- Sort info -->
        <input type="hidden" th:field="*{sortBy}">
        <input type="hidden" th:field="*{sortDirection}">

        <button type="submit" class="btn btn-success mb-3">
            <i class="bi bi-file-earmark-excel"></i> Export to Excel
        </button>
    </form>

    <div class="d-flex justify-content-between align-items-center my-3">

        <div>
            Page <span th:text="${query.pageNumber + 1}">1</span> of
            <span th:text="${totalPages}">X</span> —
            Total: <span th:text="${totalElements}">Y</span> amenities
        </div>

        <div>
            <a class="btn btn-primary btn-lg" th:href="@{/amenities/new}">Add Amenities</a>
        </div>
    </div>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
            <th>STATUS</th>
            <th>CREATED AT</th>
            <th>UPDATED AT</th>
            <th>CREATED BY</th>
            <th>UPDATED BY</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="am : ${amenities}">
            <td th:text="${am.id}">1</td>
            <td th:text="${am.name}">Name</td>
            <td th:text="${am.description}">Description</td>
            <td th:text="${am.status}">ACTIVE</td>

            <td th:text="${am.createdAt != null ? #temporals.format(am.createdAt, 'yyyy-MM-dd HH:mm') : '—'}">—</td>
            <td th:text="${am.updatedAt != null ? #temporals.format(am.updatedAt, 'yyyy-MM-dd HH:mm') : '—'}">—</td>

            <td th:text="${am.createdBy != null ? am.createdBy.name : '—'}">—</td>
            <td th:text="${am.updatedBy != null ? am.updatedBy.name : '—'}">—</td>

            <td>
                <a class="btn btn-sm btn-warning" th:href="@{'/amenities/edit/' + ${am.id}}">Edit</a>
                <a class="btn btn-sm btn-danger" th:href="@{'/amenities/delete/' + ${am.id}}">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <form th:action="@{/amenities}" method="get" class="row align-items-center justify-content-between mt-4 mb-3 no-card">
        <!-- Page size selector -->
        <div class="col-md-4">
            <label for="pageSize" class="form-label">Show</label>
            <select id="pageSize" class="form-select d-inline w-auto" name="pageSize" onchange="this.form.submit()">
                <option th:value="3" th:selected="${query.pageSize == 3}">3</option>
                <option th:value="6" th:selected="${query.pageSize == 6}">6</option>
                <option th:value="9" th:selected="${query.pageSize == 9}">9</option>
            </select>
            <span>per page</span>

            <!-- Hidden inputs -->
            <input type="hidden" name="pageNumber" th:value="${query.pageNumber}" />
            <input type="hidden" name="sortBy" th:value="${query.sortBy}" />
            <input type="hidden" name="sortDirection" th:value="${query.sortDirection}" />
        </div>

        <!-- Pagination links -->
        <div class="col-md-8 text-end">
            <nav class="d-flex justify-content-end mt-2">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${query.pageNumber == 0} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/amenities(pageNumber=${query.pageNumber - 1}, pageSize=${query.pageSize}, sortBy=${query.sortBy}, sortDirection=${query.sortDirection})}">Previous</a>
                    </li>

                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == query.pageNumber} ? 'active'">
                        <a class="page-link"
                           th:href="@{/amenities(pageNumber=${i}, pageSize=${query.pageSize}, sortBy=${query.sortBy}, sortDirection=${query.sortDirection})}"
                           th:text="${i + 1}">1</a>
                    </li>

                    <li class="page-item" th:classappend="${query.pageNumber + 1 >= totalPages} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/amenities(pageNumber=${query.pageNumber + 1}, pageSize=${query.pageSize}, sortBy=${query.sortBy}, sortDirection=${query.sortDirection})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function() {
        const toggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('appSidebar');
        const body = document.querySelector('body');

        function setCollapsed(collapsed) {
            if (!sidebar) return;
            if (collapsed) {
                sidebar.classList.add('sidebar-collapsed');
                body.classList.remove('content-with-sidebar');
                body.classList.add('content-no-sidebar');
            } else {
                sidebar.classList.remove('sidebar-collapsed');
                body.classList.remove('content-no-sidebar');
                body.classList.add('content-with-sidebar');
            }
            try { localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0'); } catch(e) {}
        }

        // initial read
        const saved = localStorage.getItem('sidebarCollapsed');
        setCollapsed(saved === '1');

        if (toggle) {
            toggle.addEventListener('click', function () {
                const isCollapsed = sidebar.classList.contains('sidebar-collapsed');
                setCollapsed(!isCollapsed);
            });
        }

        // close sidebar on small screens when clicking outside
        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 991.98) {
                if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
                    setCollapsed(true);
                }
            }
        });
    })();
</script>
</body>
</html>
