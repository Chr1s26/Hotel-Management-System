<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management System - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .bg-video, .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(46, 64, 83, 0.7);
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #f8f9fa;
        }

        .btn-luxury {
            background-color: #BFC9CA;
            color: #2E4053;
            border: none;
            transition: background-color 0.3s ease;
        }

        .btn-luxury:hover {
            background-color: #D5D8DC;
            color: #1C2833;
        }
    </style>
</head>
<body>

<div th:if="${url != null}">
    <video th:if="${type != null and type.startsWith('video')}"
           autoplay muted loop class="bg-video">
        <source th:src="${url}" th:type="${type}">
        Your browser does not support the video tag.
    </video>

    <img th:if="${type != null and type.startsWith('image')}"
         th:src="${url}" class="bg-video bg-image" alt="Background wallpaper">
</div>

<div th:if="${url == null}">
    <video autoplay muted loop class="bg-video">
        <source src="/videos/hotel_intro.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</div>

<div class="overlay"></div>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container content">
    <h1 class="display-4 fw-bold">Welcome to Hotel Management System</h1>
    <p class="lead">Manage your hotels, rooms, and more with ease.</p>
</div>

<!-- Upload wallpaper form -->
<form th:action="@{/home/upload}" th:object="${home}" method="post" enctype="multipart/form-data">
    <input type="file" th:field="*{file}" accept="video/*,image/*" hidden id="Upload" onchange="this.form.submit()">
</form>

<!-- Upload button -->
<button class="btn btn-secondary position-fixed bottom-0 end-0 m-3"
        onclick="document.getElementById('Upload').click()">
    Upload Wallpaper
</button>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
