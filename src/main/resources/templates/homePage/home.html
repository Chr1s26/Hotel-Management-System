<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management System - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(46, 64, 83, 0.7); /* overlay for contrast */
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #f8f9fa;
        }

        .btn-luxury {
            background-color: #BFC9CA;
            color: #2E4053;
            border: none;
            transition: background-color 0.3s ease;
        }

        .btn-luxury:hover {
            background-color: #D5D8DC;
            color: #1C2833;
        }
    </style>
</head>
<body>


<video autoplay muted loop class="bg-video">
    <source src="/videos/hotel_intro.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>
<div class="overlay"></div>


<div th:replace="fragments/navbar :: navbar"></div>


<div class="container content">
    <h1 class="display-4 fw-bold">Welcome to Hotel Management System</h1>
    <p class="lead">Manage your hotels, rooms, and more with ease.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>
</html>
