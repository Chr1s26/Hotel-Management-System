<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management System - Home</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your theme -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/form-theme.css}">

    <style>
        /* === Background image & video fix === */
        .bg-video, .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* Slight dark overlay for readability */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 18, 53, 0.6); /* royal tint */
            z-index: -1;
            backdrop-filter: blur(3px);
        }

        /* Home content */
        .home-content {
            position: relative;
            z-index: 1;
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .welcome-card {
            background: rgba(43, 66, 87, 0.55);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(136,169,195,0.35);
            border-radius: 16px;
            padding: 2rem 3rem;
            max-width: 700px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .welcome-card h1 {
            font-size: 2.8rem;
            color: var(--bluegray);
            text-shadow: 0 2px 10px rgba(0,0,0,0.4);
            margin-bottom: 0.5rem;
        }

        .welcome-card p {
            color: var(--soft2);
            font-size: 1.2rem;
        }

        /* Upload button — modern royal style */
        .upload-btn {
            background: var(--bluegray);
            color: var(--royal);
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 0.6rem 1.2rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.35);
            transition: all 0.25s ease;
        }

        .upload-btn:hover {
            background: #9db8cf;
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(0,0,0,0.45);
        }
    </style>
</head>

<body>
<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- Background source -->
<div th:if="${url != null}">
    <video th:if="${type != null and type.startsWith('video')}"
           autoplay muted loop class="bg-video">
        <source th:src="${url}" th:type="${type}">
        Your browser does not support the video tag.
    </video>

    <img th:if="${type != null and type.startsWith('image')}"
         th:src="${url}" class="bg-video bg-image" alt="Background wallpaper">
</div>

<div th:if="${url == null}">
    <video autoplay muted loop class="bg-video">
        <source src="/videos/hotel_intro.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</div>

<div class="overlay"></div>

<!-- Content -->
<div class="container home-content">
    <div class="welcome-card text-center">
        <h1>Welcome to Hotel Management System</h1>
        <p>Manage your hotels effortlessly in one modern platform.</p>
    </div>
</div>

<!-- Upload wallpaper form -->
<form th:action="@{/home/upload}" th:object="${home}" method="post" enctype="multipart/form-data" class="no-card">
    <input type="file" th:field="*{file}" accept="video/*,image/*" hidden id="Upload" onchange="this.form.submit()">
</form>

<!-- Floating upload button -->
<button class="upload-btn position-fixed bottom-0 end-0 m-4"
        onclick="document.getElementById('Upload').click()">
    Upload Wallpaper
</button>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
