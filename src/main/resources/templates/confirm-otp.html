<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirm OTP</title>

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="bg-royal-navy-grad min-h-screen flex flex-col items-center justify-center">
<h2 class="page-title text-4xl font-extrabold mb-8 text-bluegray">Hotel Management System</h2>

<div class="glass-card p-8 w-full max-w-md">
    <h3 class="card-title text-xl text-center font-semibold mb-6">Confirm OTP</h3>

    <!-- Show success or error alerts -->
    <div th:if="${otpError}" class="bg-red-200 bg-opacity-70 border border-red-400 text-red-900 px-4 py-3 rounded mb-4">
        <p th:text="${otpError}"></p>
    </div>

    <div th:if="${otpInfo}" class="bg-blue-200 bg-opacity-70 border border-blue-400 text-blue-900 px-4 py-3 rounded mb-4">
        <p th:text="${otpInfo}"></p>
    </div>

    <!-- OTP Form -->
    <form th:action="@{/confirm-otp}" method="post" class="space-y-5">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <label for="otp" class="block text-sm font-medium mb-1">Enter the OTP sent to your email:</label>
        <input id="otp" name="otp" type="text"
               class="glass-input mt-1 w-full"
               placeholder="Enter OTP Code" required/>

        <button type="submit" class="btn-primary w-full py-2.5">Verify OTP</button>
    </form>

    <p class="mt-6 text-center text-sm">
        Didn’t receive the code?
        <a th:href="@{/resend-otp}" class="link font-medium">Resend OTP</a>
    </p>
</div>

</body>
</html>
