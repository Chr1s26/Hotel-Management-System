
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management System - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/form-theme.css}">
</head>
<body class="royal-form-page">
<h1 class="page-title">Hotel Management System</h1>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 65vh;">
    <div style="width: 100%; max-width: 500px;">

        <h2 class="page-title">Confirm Your Account</h2>

        <!-- Message -->
        <p th:if="${message}" class="text-soft text-center mb-3" th:text="${message}"></p>
        <p th:if="${param.error == 'invalid_otp'}" class="text-danger text-center mb-3">
            Invalid OTP. Please try again.
        </p>

        <!-- Main Glass Card Form -->
        <form th:action="@{/confirm-account/verify-otp}" method="post"
              class="glass-card p-4 shadow-glass">

            <div class="mb-4">
                <label for="email" class="form-label mb-1">Email</label>
                <input type="email" id="email" name="email" th:value="${email}"
                       class="form-control" readonly>
            </div>

            <div class="mb-4">
                <label for="otp" class="form-label mb-1">Enter OTP</label>
                <input type="text" id="otp" name="otp"
                       class="form-control" placeholder="Enter the OTP" required>
            </div>

            <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-primary w-100">Verify OTP</button>
            </div>
        </form>

        <!-- Resend Link -->
        <div class="text-center mt-3">
            <form th:action="@{/confirm-account/resend-otp}" method="post" class="no-card d-inline">
                <input type="hidden" name="email" th:value="${email}">
                <button type="submit" class="link border-0 bg-transparent">
                    Resend OTP
                </button>
            </form>
        </div>

    </div>
</div>
</body>
</html>
