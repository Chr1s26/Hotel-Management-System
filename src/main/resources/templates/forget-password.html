<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forget Password</title>

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/styles.css}">

</head>
<body class="bg-royal-navy-grad min-h-screen flex flex-col items-center justify-center">
<h2 class="page-title text-4xl font-extrabold mb-8 text-bluegray">Hotel Management System</h2>

<div class="glass-card p-8 w-full max-w-md">
  <h3 class="card-title text-xl text-center font-semibold mb-6">Forget Password</h3>
<form th:action="@{/forget-password}" method="post" class="space-y-5" th:object="${emailForm}">
  <label class="block text-sm font-medium mb-1" for="email">Enter your email:</label>

  <input class="glass-input mt-1 w-full" type="email" id="email" name="email" th:value="*{email}" required>

  <p th:if="${#fields.hasErrors('email')}"
     th:errors="*{email}"
     class="text-red-600 text-sm mt-1"></p>

  <button type="submit" class="btn-primary w-full py-2.5">Submit</button>
</form>
</div>

</body>
</html>
