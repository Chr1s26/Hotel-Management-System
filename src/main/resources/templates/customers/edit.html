<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Customer</title>

    <!-- Bootstrap + Select2 -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
          rel="stylesheet" />

    <!-- Royal Blue Theme -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/form-theme.css}">
</head>

<body class="royal-form-page">
<div class="container mt-4">
    <h2 class="page-title">Update Customer</h2>

    <form th:action="@{/customers/update/{id}(id=${customer.id})}"
          th:object="${customer}" method="post"
          class="needs-validation glass-form">

        <div class="accordion royal-accordion" id="customerAccordion">

            <!-- Basic Information Section -->
            <div class="accordion-item">
                <h2 class="accordion-header" id="headingBasic">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse"
                            data-bs-target="#collapseBasic" aria-expanded="true"
                            aria-controls="collapseBasic">
                        Basic Information
                    </button>
                </h2>
                <div id="collapseBasic"
                     class="accordion-collapse collapse show"
                     aria-labelledby="headingBasic"
                     data-bs-parent="#customerAccordion">
                    <div class="accordion-body">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" th:field="*{name}" class="form-control"
                                   placeholder="Enter name" />
                            <div class="text-danger" th:if="${#fields.hasErrors('name')}"
                                 th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" th:field="*{phone}" class="form-control"
                                   placeholder="Enter phone number" />
                            <div class="text-danger" th:if="${#fields.hasErrors('phone')}"
                                 th:errors="*{phone}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Date of Birth</label>
                            <input type="date" th:field="*{dateOfBirth}" class="form-control" />
                            <div class="text-danger" th:if="${#fields.hasErrors('dateOfBirth')}"
                                 th:errors="*{dateOfBirth}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nationality</label>
                            <input type="text" th:field="*{nationality}" class="form-control"
                                   placeholder="Enter nationality" />
                            <div class="text-danger" th:if="${#fields.hasErrors('nationality')}"
                                 th:errors="*{nationality}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Additional Information Section -->
            <div class="accordion-item">
                <h2 class="accordion-header" id="headingAdditional">
                    <button class="accordion-button collapsed" type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#collapseAdditional"
                            aria-expanded="false"
                            aria-controls="collapseAdditional">
                        Additional Information
                    </button>
                </h2>
                <div id="collapseAdditional"
                     class="accordion-collapse collapse"
                     aria-labelledby="headingAdditional"
                     data-bs-parent="#customerAccordion">
                    <div class="accordion-body">

                        <!-- VIP Status -->
                        <div class="mb-3">
                            <label class="form-label">VIP Status</label><br>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio"
                                       th:field="*{vipStatus}" value="true"
                                       th:checked="${customer.vipStatus == true}">
                                <label class="form-check-label">VIP</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio"
                                       th:field="*{vipStatus}" value="false"
                                       th:checked="${customer.vipStatus == false}">
                                <label class="form-check-label">Normal</label>
                            </div>
                        </div>

                        <!-- Connected User Account -->
                        <div class="mb-3">
                            <label class="form-label">User Account</label>
                            <select th:field="*{user}" class="form-select">
                                <option value="">-- Select User --</option>
                                <option th:each="user : ${users}"
                                        th:value="${user.id}"
                                        th:text="${user.name + ' (' + user.email + ')'}"
                                        th:selected="${customer.user != null && customer.user == user.id}">
                                </option>
                            </select>
                        </div>

                    </div>
                </div>
            </div>

        </div>

        <!-- Buttons -->
        <div class="mt-4 text-center">
            <button type="submit" class="btn btn-primary me-2">Update Customer</button>
            <a class="btn btn-secondary" th:href="@{/customers}">Cancel</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
    $(document).ready(function() {
        $('select').select2();
    });
</script>
</body>
</html>
