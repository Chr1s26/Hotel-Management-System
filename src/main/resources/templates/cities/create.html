<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Cities</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Select2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #2E4053; /* Dark gray background */
            color: white;              /* White text globally */
            padding-top: 70px;
        }
        form {
            background-color: #6E6E6E; /* Slightly lighter gray for form background */
            padding: 20px;
            border-radius: 8px;
        }
        label.form-label {
            color: white; /* Ensure labels are white */
        }
        .form-control, .form-select {
            background-color: #7F7F7F; /* Medium gray input background */
            color: white;              /* White text inside inputs */
            border: 1px solid #999;
        }
        .form-control:focus, .form-select:focus {
            background-color: #8F8F8F; /* Slightly lighter on focus */
            color: white;
            border-color: #ccc;
            box-shadow: none;
        }
        .text-danger {
            color: #FF6B6B; /* Keep error text red for visibility */
        }
        .btn-primary {
            background-color: #555555; /* Dark gray button */
            border-color: #555555;
            color: white;
        }
        .btn-primary:hover {
            background-color: #777777;
            border-color: #777777;
            color: white;
        }
        .btn-secondary {
            background-color: #333333; /* Even darker gray */
            border-color: #333333;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #555555;
            border-color: #555555;
            color: white;
        }
    </style>
</head>

<body class="container mt-4">
<div th:replace="fragments/navbar :: navbar"></div>
<h2>Create Cities</h2>

<form th:action="@{/cities/create}" th:object="${city}" method="post" class="needs-validation">

    <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" th:field="*{name}" class="form-control"/>
        <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>

    <div class="mb-3">
        <label class="form-label">Regions</label>
        <select id="region-select" th:field="*{region.id}" class="form-select" required>
            <option value="" disabled selected>-- Select Region --</option>
            <option th:each="region : ${regions}"
                    th:value="${region.id}"
                    th:text="${region.name}">
            </option>
        </select>

        <div class="text-danger" th:if="${#fields.hasErrors('region')}" th:errors="*{region}"></div>

    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a class="btn btn-secondary" th:href="@{/city}">Cancel</a>

</form>

<!-- jQuery and Select2 JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
    $(document).ready(function() {
        $('#region-select').select2({
            placeholder: "Select or type a region",
            allowClear: true,
            width: '100%'
        });
    });
</script>
</body>
</html>
