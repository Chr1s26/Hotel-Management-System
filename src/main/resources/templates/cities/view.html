<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>City View</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/form-theme.css}">
</head>

<body class="royal-form-page">
<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="container mt-4">
    <h2 class="page-title" th:text="${city.name}">City Name</h2>

    <!-- Tabs Navigation -->
    <ul class="nav nav-tabs mb-3" id="cityTabs" role="tablist">
        <li class="nav-item">
            <a class="nav-link active" id="home-tab" data-bs-toggle="tab" href="#home" role="tab">Home</a>
        </li>
    </ul>

    <div class="tab-content" id="cityTabsContent">
        <!-- Home Tab -->
        <div class="tab-pane fade show active" id="home" role="tabpanel">
            <div class="glass-card p-4 mb-4">
                <h4 class="text-bluegray mb-3">City Information</h4>
                <p><strong>City ID: </strong><span th:text="${city.id}"></span></p>
                <p><strong>City Name: </strong><span th:text="${city.name}"></span></p>
                <p><strong>Region: </strong><span th:text="${city.region}"></span></p>
                <p><strong>Status: </strong><span th:text="${city.status}"></span></p>
                <p><strong>Created At: </strong> <span th:text="${city.createdAt}"></span></p>
                <p><strong>Updated At: </strong><span th:text="${city.updatedAt}"></span></p>
                <p><strong>Created By:</strong> <span th:text="${city.createdBy}"></span></p>
                <p><strong>Updated By: </strong><span th:text="${city.updatedBy}"></span></p>
                <p></p>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/cities}" class="btn btn-secondary">
            Back
        </a>
    </div>

</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function() {
        const toggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('appSidebar');
        const body = document.querySelector('body');

        if (!sidebar) return;
        const savedState = localStorage.getItem("sidebar-collapsed") === "true";

        function setCollapsed(collapsed) {
            if (collapsed) {
                sidebar.classList.add('sidebar-collapsed');
                body.classList.remove('content-with-sidebar');
                body.classList.add('content-no-sidebar');
            } else {
                sidebar.classList.remove('sidebar-collapsed');
                body.classList.remove('content-no-sidebar');
                body.classList.add('content-with-sidebar');
            }
            try { localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0'); } catch(e) {}
        }

        const saved = localStorage.getItem('sidebarCollapsed');
        setCollapsed(saved === '1');

        if (toggle) {
            toggle.addEventListener('click', function () {
                const isCollapsed = sidebar.classList.contains('sidebar-collapsed');
                setCollapsed(!isCollapsed);
            });
        }

        // close sidebar on small screens when clicking outside
        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 991.98) {
                if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
                    setCollapsed(true);
                }
            }
        });
    })();
</script>
</body>
</html>
