<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>City</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/form-theme.css}">
    <style>
        body {
            background: linear-gradient(135deg, var(--royal), var(--navy));
            color: var(--soft);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding-top: 80px;
        }

        .profile-container {
            max-width: 900px;
            margin: 60px auto;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(20, 32, 46, 0.7);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(136,169,195,0.35);
            box-shadow: 0 12px 30px rgba(0,0,0,0.45);
        }

        .profile-header {
            background: linear-gradient(to right, var(--midnight), var(--royal));
            text-align: center;
            color: var(--soft);
            padding: 40px 20px;
            border-bottom: 1px solid rgba(136,169,195,0.2);
        }

        .profile-header img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid var(--bluegray);
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 0 12px rgba(136,169,195,0.5);
        }

        .profile-header h2 {
            font-weight: 600;
            color: var(--bluegray);
            margin-bottom: 5px;
        }

        .profile-header p {
            color: var(--soft2);
            margin-bottom: 6px;
        }

        /* 📋 Body section */
        .profile-body {
            padding: 30px;
        }

        .profile-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px 28px;
        }

        .profile-info div {
            background: rgba(43,66,87,0.4);
            padding: 14px 20px;
            border-radius: 10px;
            color: var(--soft);
            border: 1px solid rgba(136,169,195,0.25);
            transition: background-color .2s;
        }

        .profile-info div:hover {
            background: rgba(43,66,87,0.6);
        }

        .label {
            font-weight: 600;
            color: var(--bluegray);
        }

        /* 📤 Upload form */
        .upload-form {
            text-align: center;
            margin-top: 25px;
        }

        .upload-form input[type="file"] {
            display: none;
        }

        .upload-form label {
            background: var(--bluegray);
            color: var(--royal);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
        }

        .upload-form label:hover {
            background: #9db8cf;
        }

        .btn-update {
            background: var(--midnight);
            color: var(--soft);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-left: 6px;
            font-weight: 600;
        }

        .btn-update:hover {
            background: var(--royal);
        }

        /* Navbar layering fix */
        .navbar { z-index: 1050 !important; }
        .dropdown-menu { z-index: 2000 !important; }
    </style>
</head>
<body class="royal-form-page">
<div th:replace="fragments/sidebar :: sidebar"></div>
<h1 class="page-title">City</h1>
<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/cities}" class="btn btn-secondary">
            <- Back
        </a>
    </div>

    <div class="profile-container">
        <div class="profile-body">
            <div class="profile-info">
                <div><span class="label">City ID :</span> <span th:text="${city.id}"></span></div>
                <div><span class="label">City Name :</span> <span th:text="${city.name}"></span></div>
                <div><span class="label">Region :</span> <span th:text="${city.region}"></span></div>
                <div><span class="label">Status :</span> <span th:text="${city.status}"></span></div>
                <div><span class="label">Created At :</span><span th:text="${city.createdAt}"></span></div>
                <div><span class="label">Updated At :</span><span th:text="${city.updatedAt}"></span></div>
                <div><span class="label">Created By :</span><span th:text="${city.createdBy}"></span></div>
                <div><span class="label">Updated By :</span><span th:text="${city.updatedBy}"></span></div>

            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function() {
        const toggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('appSidebar');
        const body = document.querySelector('body');

        if (!sidebar) return;
        const savedState = localStorage.getItem("sidebar-collapsed") === "true";

        function setCollapsed(collapsed) {
            if (collapsed) {
                sidebar.classList.add('sidebar-collapsed');
                body.classList.remove('content-with-sidebar');
                body.classList.add('content-no-sidebar');
            } else {
                sidebar.classList.remove('sidebar-collapsed');
                body.classList.remove('content-no-sidebar');
                body.classList.add('content-with-sidebar');
            }
            try { localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0'); } catch(e) {}
        }

        const saved = localStorage.getItem('sidebarCollapsed');
        setCollapsed(saved === '1');

        if (toggle) {
            toggle.addEventListener('click', function () {
                const isCollapsed = sidebar.classList.contains('sidebar-collapsed');
                setCollapsed(!isCollapsed);
            });
        }

        // close sidebar on small screens when clicking outside
        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 991.98) {
                if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
                    setCollapsed(true);
                }
            }
        });
    })();
</script>
</body>
</html>
