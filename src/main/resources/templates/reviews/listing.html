<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Review List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #2E4053;
            color: white;
            padding-top: 70px;
        }

        h2 {
            padding-top: 30px;
            text-align: center;
        }

        table {
            background-color: #3A3A3A;
            color: white;
        }

        thead th {
            background-color: #3A3A3A !important;
            color: white !important;
        }

        tbody td {
            background-color: #5A5A5A !important;
            color: white !important;
        }

        th, td {
            text-align: center;
            background: #3A3A3A;
            vertical-align: middle;
        }

        .table-bordered {
            border: 1px solid #999;
        }

        .btn-warning {
            background-color: #ffc107;
            color: black;
            border: none;
        }

        .btn-warning:hover {
            background-color: #e0a800;
        }

        .btn-danger {
            background-color: #dc3545;
            border: none;
        }

        .btn-danger:hover {
            background-color: #bb2d3b;
        }

        .btn-primary {
            background-color: #555555;
            border-color: #555555;
            color: white;
        }

        .btn-primary:hover {
            background-color: #777777;
            border-color: #777777;
            color: white;
        }

        .container {
            padding-top: 20px;
        }

        .text-center a.btn {
            margin-top: 10px;
        }
    </style>
</head>
<body class="container mt-4">
<div th:replace="fragments/navbar :: navbar"></div>
<h2>Reviews</h2>
<table class="table table-bordered">
    <thead>
    <tr><th>ID</th><th>Description</th><th>Rating</th><th>Review Date</th><th>Hotel</th><th>User</th></tr>
    </thead>
    <tbody>
    <tr th:each="rev : ${reviews}">
        <td th:text="${rev.id}"></td>
        <td th:text="${rev.description}"></td>
        <td th:text="${rev.rating}"></td>
        <td th:text="${rev.reviewDate}"></td>
        <td th:text="${rev.getHotel()}"></td>
        <td th:text="${rev.getUser()}"></td>
        <td>
            <a class="btn btn-sm btn-warning" th:href="@{'/reviews/edit/' + ${rev.id}}">Edit</a>
            <a class="btn btn-sm btn-danger" th:href="@{'/reviews/delete/' + ${rev.id}}">Delete</a>
        </td>
    </tr>
    </tbody>
</table>
<div class="text-center my-3">
    <a class="btn btn-primary btn-sm" th:href="@{/reviews/new}">Add Review</a>
</div>
</body>
</html>
