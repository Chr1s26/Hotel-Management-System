<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Hotel List</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <link rel="stylesheet" th:href="@{/css/form-theme.css}">
</head>
<body class="royal-form-page">
<div th:replace="fragments/sidebar :: sidebar"></div>
<div class="container mt-4">
  <h2>Exported Lists</h2>

  <form th:action="@{/exports}" th:object="${query}" method="post" class="row g-3 align-items-end mb-4 no-card">

    <div class="col-md-3">
      <label for="searchName" class="form-label">File Name</label>
      <input type="hidden" th:name="*{filterList[0].field}" th:value="'FILE_NAME'">
      <input type="hidden" th:name="*{filterList[0].matchType}" th:value="'CONTAINS'">
      <input type="text" id="searchName" name="name" class="form-control" th:field="*{filterList[0].value}" placeholder="Search by file name">
    </div>

    <div class="col-md-3">
      <label for="searchFileType" class="form-label">File Type</label>
      <input type="hidden" th:name="*{filterList[1].field}" th:value="'FILE_TYPE'">
      <input type="hidden" th:name="*{filterList[1].matchType}" th:value="'EXACT'">
      <select th:field="*{filterList[1].value}" id="searchFileType" name="fileType" class="form-select">
        <option value="">All</option>
        <option value="Address_Listing">Address_Listing</option>
        <option value="City_Listing">City_Listing</option>
        <option value="Country_Listing">Country_Listing</option>
        <option value="Customer_Listing">Customer_Listing</option>
        <option value="Admin_Listing">Admin_Listing</option>
        <option value="Editor_Listing">Editor_Listing</option>
        <option value="Hotel_Listing">Hotel_Listing</option>
        <option value="Policy_Listing">Policy_Listing</option>
        <option value="Promotion_Listing">Promotion_Listing</option>
        <option value="PropertyDescription_Listing">PropertyDescription_Listing</option>
        <option value="Region_Listing">Region_Listing</option>
        <option value="Role_Listing">Role_Listing</option>
        <option value="Room_Listing">Room_Listing</option>
        <option value="User_Listing">User_Listing</option>
      </select>
    </div>

    <div class="col-md-3">
      <label for="searchStatus" class="form-label">Status</label>
      <input type="hidden" th:name="*{filterList[2].field}" th:value="'STATUS'">
      <input type="hidden" th:name="*{filterList[2].matchType}" th:value="'EXACT'">
      <select th:field="*{filterList[2].value}" id="searchStatus" name="statusType" class="form-select">
        <option value="">All</option>
        <option value="COMPLETED">COMPLETED</option>
        <option value="PROCESSING">PROCESSING</option>
        <option value="FAIL">FAIL</option>
        <option value="DELETED">DELETED</option>
        <option value="ACTIVE">ACTIVE</option>
        <option value="INACTIVE">INACTIVE</option>
      </select>
    </div>

    <div class="col-md-3">
      <label class="form-label">Sort By</label>
      <select th:field="*{sortBy}" class="form-select" >
        <option value="name">Name</option>
        <option value="createdAt">Created Date</option>
      </select>
    </div>

    <div class="col-md-3">
      <label class="form-label">Order</label>
      <select th:field="*{sortDirection}" class="form-select">
        <option value="ASC">Ascending</option>
        <option value="DESC">Descending</option>
      </select>
    </div>

    <div class="col-md-3 d-flex align-items-end">
      <button type="submit" class="btn btn-primary me-2">Search</button>
      <a th:href="@{/exports}" class="btn btn-secondary">Reset</a>
    </div>
  </form>

  <div class="d-flex justify-content-between align-items-center my-3">
    <div>
      Page <span th:text="${query.pageNumber + 1}">1</span> of
      <span th:text="${totalPages}">X</span> —
      Total: <span th:text="${totalElements}">Y</span> hotels
    </div>
  </div>

  <table class="table table-bordered">
    <thead>
    <tr>
      <th>ID</th>
      <th>File Name</th>
      <th>File Type</th>
      <th>Status</th>
      <th>Created By</th>
      <th>Created At</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="file : ${exports}">
      <td th:text="${file.id}"></td>
      <td th:text="${file.fileName}"></td>
      <td th:text="${file.fileType}"></td>
      <td th:text="${file.status}"></td>
      <td th:text="${file.createdBy != null ? file.createdBy.name : '—'}">—</td>
      <td th:text="${file.createdAt != null ? #temporals.format(file.createdAt, 'yyyy-MM-dd HH:mm') : '—'}">—</td>
      <td class="text-center">
        <div class="d-flex justify-content-center gap-2">

          <form th:action="@{'/exports/download-zip/' + ${file.id}}" method="get" class="m-0 p-0">
            <button type="submit" class="btn btn-success btn-sm py-1 px-3" title="Download ZIP" style="font-size: 0.85rem;">
              <i class="bi bi-download me-1"></i>Download
            </button>
          </form>

          <form th:action="@{'/exports/delete/' + ${file.id}}" method="post" class="m-0 p-0"
                onsubmit="return confirm('Are you sure you want to delete this file?');">
            <button type="submit" class="btn btn-danger btn-sm py-1 px-3" title="Delete" style="font-size: 0.85rem;">
              <i class="bi bi-trash me-1"></i>Delete
            </button>
          </form>

        </div>
      </td>

    </tr>
    </tbody>
  </table>

  <form th:action="@{/exports}" method="get" class="row align-items-center justify-content-between mt-4 mb-3 no-card" >
    <!-- Page size selector -->
    <div class="col-md-4">
      <label for="pageSize" class="form-label">Show</label>
      <select id="pageSize" class="form-select d-inline w-auto" name="pageSize" onchange="this.form.submit()">
        <option th:value="3" th:selected="${query.pageSize == 3}">3</option>
        <option th:value="6" th:selected="${query.pageSize == 6}">6</option>
        <option th:value="9" th:selected="${query.pageSize == 9}">9</option>
      </select>
      <span>per page</span>

      <!-- Hidden inputs -->
      <input type="hidden" name="pageNumber" th:value="${query.pageNumber}" />
      <input type="hidden" name="sortBy" th:value="${query.sortBy}" />
      <input type="hidden" name="sortDirection" th:value="${query.sortDirection}" />
    </div>

    <!-- Pagination links -->
    <div class="col-md-8 text-end">
      <nav class="d-flex justify-content-end mt-2">
        <ul class="pagination">
          <li class="page-item" th:classappend="${query.pageNumber == 0} ? 'disabled'">
            <a class="page-link"
               th:href="@{/exports(pageNumber=${query.pageNumber - 1}, pageSize=${query.pageSize}, sortBy=${query.sortBy}, sortDirection=${query.sortDirection})}">Previous</a>
          </li>

          <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
              th:classappend="${i == query.pageNumber} ? 'active'">
            <a class="page-link"
               th:href="@{/exports(pageNumber=${i}, pageSize=${query.pageSize}, sortBy=${query.sortBy}, sortDirection=${query.sortDirection})}"
               th:text="${i + 1}">1</a>
          </li>

          <li class="page-item" th:classappend="${query.pageNumber + 1 >= totalPages} ? 'disabled'">
            <a class="page-link"
               th:href="@{/exports(pageNumber=${query.pageNumber + 1}, pageSize=${query.pageSize}, sortBy=${query.sortBy}, sortDirection=${query.sortDirection})}">Next</a>
          </li>
        </ul>
      </nav>
    </div>
  </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  (function() {
    const toggle = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('appSidebar');
    const body = document.querySelector('body');

    function setCollapsed(collapsed) {
      if (!sidebar) return;
      if (collapsed) {
        sidebar.classList.add('sidebar-collapsed');
        body.classList.remove('content-with-sidebar');
        body.classList.add('content-no-sidebar');
      } else {
        sidebar.classList.remove('sidebar-collapsed');
        body.classList.remove('content-no-sidebar');
        body.classList.add('content-with-sidebar');
      }
      try { localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0'); } catch(e) {}
    }

    // initial read
    const saved = localStorage.getItem('sidebarCollapsed');
    setCollapsed(saved === '1');

    if (toggle) {
      toggle.addEventListener('click', function () {
        const isCollapsed = sidebar.classList.contains('sidebar-collapsed');
        setCollapsed(!isCollapsed);
      });
    }

    // close sidebar on small screens when clicking outside
    document.addEventListener('click', function(e) {
      if (window.innerWidth <= 991.98) {
        if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
          setCollapsed(true);
        }
      }
    });
  })();
</script>
</body>
</html>
