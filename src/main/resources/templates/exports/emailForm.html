<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Send Export File</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="container mt-5">

<h3>Send Exported File</h3>

<form th:action="@{/exports/send}" method="post">
    <input type="hidden" name="fileId" th:value="${fileId}">

    <div class="mb-3">
        <label class="form-label">Recipient Email</label>
        <input type="email" name="email" class="form-control" required placeholder="Enter email address">
    </div>

    <div class="mb-3">
        <label class="form-label">Subject</label>
        <input type="text" name="subject" class="form-control" required placeholder="Enter subject">
    </div>

    <div class="text-end mt-4">
        <button type="submit" class="btn btn-primary">Send Email</button>
        <a th:href="@{/exports}" class="btn btn-secondary">Cancel</a>
    </div>
</form>

</body>

</html>
