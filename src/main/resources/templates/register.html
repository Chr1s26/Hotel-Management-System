<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- ... same head as your original ... -->
</head>
<body>
<div class="form-container">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Register</h2>

    <div th:if="${registrationError}" class="alert alert-error">
        <p th:text="${registrationError}"></p>
    </div>

    <form th:action="@{/register}" th:object="${user}" method="POST" class="space-y-4">
        <div>
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username:</label>
            <input type="text" id="username" th:field="*{name}" class="input-field" placeholder="Enter your username" required>
            <!-- Use th:field="*{name}" because your UserDetailsImpl uses 'name' -->
        </div>

        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email:</label>
            <input type="email" id="email" th:field="*{email}" class="input-field" placeholder="Enter your email" required>
        </div>

        <div>
            <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone:</label>
            <input type="text" id="phone" th:field="*{phone}" class="input-field" placeholder="Enter your phone number" required>
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password:</label>
            <input type="password" id="password" th:field="*{password}" class="input-field" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn-primary">Register</button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-600">
        Already have an account?
        <a th:href="@{/login}" class="font-medium text-indigo-600 hover:text-indigo-500">Login here</a>
    </p>
</div>
</body>
</html>
