<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Users</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #2E4053;
            color: white;
            padding-top: 70px;
        }

        h2 {
            text-align: center;
            padding-top: 30px;
        }

        table {
            background-color: #3A3A3A;
            color: white;
        }

        thead th {
            background-color: #3A3A3A !important;
            color: white !important;
        }

        tbody td {
            background-color: #5A5A5A !important;
            color: white !important;
        }

        th, td {
            text-align: center;
            vertical-align: middle;
        }

        .table-bordered {
            border: 1px solid #999;
        }

        .btn-warning {
            background-color: #ffc107;
            color: black;
            border: none;
        }

        .btn-warning:hover {
            background-color: #e0a800;
        }

        .btn-danger {
            background-color: #dc3545;
            border: none;
        }

        .btn-danger:hover {
            background-color: #bb2d3b;
        }

        .btn-primary {
            background-color: #555555;
            border-color: #555555;
            color: white;
        }

        .btn-primary:hover {
            background-color: #777777;
            border-color: #777777;
            color: white;
        }

        .container {
            padding-top: 20px;
        }

        .pagination .page-item.active .page-link {
            background-color: #6c757d;
            color: white;
            border-color: #6c757d;
        }

        .pagination .page-link {
            color: #6c757d;
            background-color: transparent;
            border: 1px solid transparent;
        }

        .pagination .page-link:hover {
            background-color: #5a6268;
            color: white;
            border-color: #5a6268;
        }

        .pagination .page-item.disabled .page-link {
            color: #adb5bd;
            pointer-events: none;
            background-color: transparent;
            border-color: transparent;
        }

        .form-label, .form-select {
            color: white;
        }

        #pageSize {
            background-color: #3A3A3A;
            color: white;
            border: 1px solid #ccc;
        }

        #pageSize option {
            background-color: #2E4053;
            color: white;
        }

        .role-badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            margin: 0.1rem 0;
            border-radius: 0.25rem;
            background: #2E4053;
            border: 1px solid #6c757d;
            font-size: 0.85rem;
        }

        .btn-assign {
            background-color: #17a2b8;
            border: none;
            color: white;
        }
        .btn-assign:hover {
            background-color: #138496;
        }
        .navbar { z-index: 1050 !important; }

        .dropdown-menu { z-index: 2000 !important; }
    </style>
</head>
<body class="container mt-4">
<div th:replace="fragments/navbar :: navbar"></div>

<h2>Users</h2>
<form th:action="@{/users}" method="get" class="row g-3 align-items-center mb-4">
    <div class="col-md-3">
        <label for="searchName" class="form-label">Name</label>
        <input type="text" id="searchName" name="name" class="form-control"
               th:value="${param.name}" placeholder="Search by name">
    </div>

    <div class="col-md-3">
        <label for="searchEmail" class="form-label">Email</label>
        <input type="text" id="searchEmail" name="email" class="form-control"
               th:value="${param.email}" placeholder="Search by email">
    </div>

    <div class="col-md-3">
        <label for="searchStatus" class="form-label">Status</label>
        <select id="searchStatus" name="statusType" class="form-select">
            <option value="">All</option>
            <option value=1 th:selected="ACTIVE">ACTIVE</option>
            <option value=0 th:selected="INACTIVE">INACTIVE</option>
        </select>
    </div>

    <div class="col-md-3 d-flex align-items-end">
        <button type="submit" class="btn btn-primary me-2">Search</button>
        <a th:href="@{/users}" class="btn btn-secondary">Reset</a>
    </div>
</form>

<div class="d-flex justify-content-between align-items-center my-3">
    <div>
        Page <span th:text="${response.pageNumber + 1}">1</span> of
        <span th:text="${response.totalPages}">X</span> —
        Total: <span th:text="${response.totalElements}">Y</span> users
    </div>

    <div>
        <a class="btn btn-primary btn-lg" th:href="@{/users/new}">Add Users</a>
    </div>
</div>

<table class="table table-bordered">
    <thead>
    <tr>
        <th>ID</th>
        <th>NAME</th>
        <th>EMAIL</th>
        <th>CONFIRMED AT</th>
        <th>ROLES</th>
        <th>STATUS</th>
        <th>CREATED AT</th>
        <th>UPDATED AT</th>
        <th>CREATED BY</th>
        <th>UPDATED BY</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}">1</td>
        <td th:text="${user.name}">John Doe</td>
        <td th:text="${user.email}">john@example.com</td>
        <td th:text="${user.confirmedAt != null ? #temporals.format(user.confirmedAt, 'yyyy-MM-dd HH:mm') : '—'}">—</td>

        <td>
            <div th:if="${user.roles != null}">
                <div th:each="r : ${user.roles}" class="role-badge" th:text="${r.roleName}">NORMAL_USER</div>
            </div>
            <div th:if="${user.roles == null || #lists.isEmpty(user.roles)}">—</div>
        </td>

        <td th:text="${user.status}">ACTIVE</td>

        <td th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm') : '—'}">—</td>
        <td th:text="${user.updatedAt != null ? #temporals.format(user.updatedAt, 'yyyy-MM-dd HH:mm') : '—'}">—</td>

        <td th:text="${user.createdBy != null ? user.createdBy.name : '—'}">—</td>
        <td th:text="${user.updatedBy != null ? user.updatedBy.name : '—'}">—</td>

        <td>
            <a class="btn btn-sm btn-warning" th:href="@{'/users/edit/' + ${user.id}}">Edit</a>
            <a class="btn btn-sm btn-danger" th:href="@{'/users/delete/' + ${user.id}}">Delete</a>
        </td>

    </tr>
    </tbody>
</table>

<form th:action="@{/users}" method="get" class="row align-items-center justify-content-between mt-4 mb-3">
    <!-- Page size selector -->
    <div class="col-md-4">
        <label for="pageSize" class="form-label">Show</label>
        <select id="pageSize" class="form-select d-inline w-auto" name="pageSize" onchange="this.form.submit()">
            <option th:value="3" th:selected="${response.pageSize == 3}">3</option>
            <option th:value="6" th:selected="${response.pageSize == 6}">6</option>
            <option th:value="9" th:selected="${response.pageSize == 9}">9</option>
        </select>
        <span>per page</span>

        <!-- Hidden inputs -->
        <input type="hidden" name="pageNumber" th:value="${response.pageNumber}" />
        <input type="hidden" name="sortBy" th:value="${sortBy}" />
        <input type="hidden" name="sortOrder" th:value="${sortOrder}" />
    </div>

    <!-- Pagination links -->
    <div class="col-md-8 text-end">
        <nav class="d-flex justify-content-end mt-2">
            <ul class="pagination">
                <li class="page-item" th:classappend="${response.pageNumber == 0} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/users(pageNumber=${response.pageNumber - 1}, pageSize=${response.pageSize}, sortBy=${sortBy}, sortOrder=${sortOrder})}">Previous</a>
                </li>

                <li class="page-item" th:each="i : ${#numbers.sequence(0, response.totalPages - 1)}"
                    th:classappend="${i == response.pageNumber} ? 'active'">
                    <a class="page-link"
                       th:href="@{/users(pageNumber=${i}, pageSize=${response.pageSize}, sortBy=${sortBy}, sortOrder=${sortOrder})}"
                       th:text="${i + 1}">1</a>
                </li>

                <li class="page-item" th:classappend="${response.pageNumber + 1 >= response.totalPages} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/users(pageNumber=${response.pageNumber + 1}, pageSize=${response.pageSize}, sortBy=${sortBy}, sortOrder=${sortOrder})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>
</form>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
