<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create User</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #2E4053; /* Dark gray background */
            color: white;              /* White text globally */
            padding-top: 70px;
        }
        form {
            background-color: #6E6E6E; /* Slightly lighter gray for form background */
            padding: 20px;
            border-radius: 8px;
        }
        label.form-label {
            color: white; /* Ensure labels are white */
        }
        .form-control, .form-select {
            background-color: #7F7F7F; /* Medium gray input background */
            color: white;              /* White text inside inputs */
            border: 1px solid #999;
        }
        .form-control:focus, .form-select:focus {
            background-color: #8F8F8F; /* Slightly lighter on focus */
            color: white;
            border-color: #ccc;
            box-shadow: none;
        }
        .text-danger {
            color: #FF6B6B; /* Keep error text red for visibility */
        }
        .btn-primary {
            background-color: #555555; /* Dark gray button */
            border-color: #555555;
            color: white;
        }
        .btn-primary:hover {
            background-color: #777777;
            border-color: #777777;
            color: white;
        }
        .btn-secondary {
            background-color: #333333; /* Even darker gray */
            border-color: #333333;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #555555;
            border-color: #555555;
            color: white;}

        /* Match form background and white text for single select */
        .select2-container--default .select2-selection--single {
            background-color: #6E6E6E; /* Match form background */
            color: white;
            border: 1px solid #999;
        }

        /* Match form background and white text for multi-select */
        .select2-container--default .select2-selection--multiple {
            background-color: #6E6E6E;
            color: white;
            border: 1px solid #999;
        }

        /* White text inside the dropdown list */
        .select2-container--default .select2-results__option {
            color: white;
            background-color: #6E6E6E;
        }

        /* Highlighted option */
        .select2-container--default .select2-results__option--highlighted[aria-selected] {
            background-color: #7F7F7F;
            color: white;
        }

        /* Placeholder text */
        .select2-container--default .select2-selection--single .select2-selection__placeholder {
            color: black;
            font-weight: bold;
            text-shadow: 0 0 2px #000000;
        }

        /* Tag style for multiple select selections */
        .select2-container--default .select2-selection--multiple .select2-selection__choice {
            background-color: #555555;
            border: none;
            color: white;
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: white !important;          /* Ensure selected text is white */
        }

        /* Selected item in dropdown list (highlighted) */
        .select2-container--default .select2-results__option[aria-selected="true"] {
            background-color: #444444 !important;  /* Slightly different to indicate selection */
            color: white !important;
        }
        .navbar { z-index: 1050 !important; }
        .dropdown-menu { z-index: 2000 !important; }
    </style>
</head>
<body class="container mt-4">
<div th:replace="fragments/navbar :: navbar"></div>
