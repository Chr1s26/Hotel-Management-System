<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- ... same head as your original ... -->
</head>
<body>
<div class="form-container">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Login</h2>

    <!-- Error message -->
    <div th:if="${param.error}" class="alert alert-error">
        Invalid username or password.
    </div>

    <!-- Success message after registration -->
    <div th:if="${param.registered}" class="alert alert-success">
        You have been successfully registered! Please login.
    </div>

    <form th:action="@{/authenticateTheUser}" method="POST" class="space-y-4">
        <div>
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username:</label>
            <!-- Notice name="username" - matches Spring Security default -->
            <input type="text" id="username" name="username" class="input-field" placeholder="Enter your username" required>
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password:</label>
            <input type="password" id="password" name="password" class="input-field" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn-primary">Login</button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-600">
        Don't have an account?
        <a th:href="@{/register}" class="font-medium text-indigo-600 hover:text-indigo-500">Register here</a>
    </p>
</div>
</body>
</html>
