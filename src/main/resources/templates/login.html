<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Login | Hotel Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/styles.css}">

</head>
<body class="bg-royal-navy-grad min-h-screen flex flex-col items-center justify-center">
<h2 class="page-title text-4xl font-extrabold mb-8 text-bluegray">Hotel Management System</h2>

<div class="glass-card p-8 w-full max-w-md">
    <h3 class="card-title text-xl text-center font-semibold mb-6">Login</h3>

    <!-- Alerts -->
    <div th:if="${errorMessage}" class="bg-red-200 bg-opacity-70 border border-red-400 text-red-900 px-4 py-3 rounded mb-4">
        <p th:text="${errorMessage}"></p>
    </div>
    <div th:if="${registeredMessage}" class="bg-green-200 bg-opacity-70 border border-green-400 text-green-900 px-4 py-3 rounded mb-4">
        <p th:text="${registeredMessage}"></p>
    </div>
    <div th:if="${otpMessage}" class="bg-yellow-200 bg-opacity-70 border border-yellow-400 text-yellow-900 px-4 py-3 rounded mb-4">
        <p th:text="${otpMessage}"></p>
    </div>

    <!-- Form -->
    <form th:action="@{/authenticateTheUser}" method="POST" class="space-y-5">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div>
            <label for="username" class="block text-sm font-medium mb-1">Username</label>
            <input id="username" name="username" type="text"
                   class="glass-input mt-1 w-full"
                   placeholder="Enter your username" required />
        </div>

        <div>
            <label for="password" class="block text-sm font-medium mb-1">Password</label>
            <input id="password" name="password" type="password"
                   class="glass-input mt-1 w-full"
                   placeholder="Enter your password" required />
        </div>

        <button type="submit" class="btn-primary w-full py-2.5">Login</button>
    </form>

    <p class="mt-6 text-center text-sm">
        Don’t have an account?
        <a th:href="@{/register}" class="link font-medium">Register here</a>
    </p>
    <p class="mt-6 text-center text-sm">
        <a th:href="@{/forget-password}" class="link font-medium">Forget Password ?</a>
    </p>
</div>
</body>
</html>
