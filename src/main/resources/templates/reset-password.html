<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="bg-royal-navy-grad min-h-screen flex flex-col items-center justify-center">
<h2 class="page-title text-4xl font-extrabold mb-8 text-bluegray">Hotel Management System</h2>

<div class="glass-card p-8 w-full max-w-md">
    <h3 class="card-title text-xl text-center font-semibold mb-6">Reset Password</h3>

    <div th:if="${error}" class="bg-red-200 border border-red-400 text-red-900 px-4 py-3 rounded mb-4">
        <p th:text="${error}"></p>
    </div>

    <form th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post" class="space-y-5">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <label class="block text-sm font-medium mb-1" for="password">New Password</label>
        <input class="glass-input mt-1 w-full" type="password" id="password" th:field="*{password}" required>

        <label class="block text-sm font-medium mb-1" for="confirmPassword">Confirm Password</label>
        <input class="glass-input mt-1 w-full" type="password" id="confirmPassword" th:field="*{confirmPassword}" required>

        <button type="submit" class="btn-primary w-full py-2.5">Reset Password</button>
    </form>

</div>

</body>
</html>
