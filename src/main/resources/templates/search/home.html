<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hotel Search</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/form-theme.css}">
</head>

<body class="royal-form-page">
<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="container mt-5">
    <div class="glass-card p-4">
        <h2 class="mb-4 text-center">Find Your Stay</h2>

        <form th:action="@{/search}" th:object="${search}" method="post" class="row g-3">

            <div class="col-md-6">
                <label class="form-label">Hotel / City / Country</label>
                <input type="text" th:field="*{keyword}" class="form-control"
                       placeholder="Bangkok, Thailand, Hilton..." required>
            </div>

            <div class="col-md-3">
                <label class="form-label">Check-in</label>
                <input type="date" th:field="*{checkIn}" class="form-control" required>
            </div>

            <div class="col-md-3">
                <label class="form-label">Check-out</label>
                <input type="date" th:field="*{checkOut}" class="form-control" required>
            </div>

            <div class="col-md-3">
                <label class="form-label">Guests</label>
                <input type="number" th:field="*{guests}" min="1" class="form-control" required>
            </div>

            <div class="col-md-12 text-end">
                <button class="btn btn-primary btn-lg mt-3">
                    Search Hotels
                </button>
            </div>

        </form>
    </div>
</div>
</body>
</html>
