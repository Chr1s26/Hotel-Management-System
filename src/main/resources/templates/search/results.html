<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hotel Search Results</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body { background: #f4f7fb; }

        /* SEARCH BAR */
        .search-bar {
            background: linear-gradient(135deg, #0f2b5b, #1e4fa1);
            padding: 20px;
            border-radius: 12px;
            color: #fff;
        }

        /* FILTER */
        .filter-box {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }

        /* HOTEL CARD */
        .hotel-card {
            background: #fff;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            display: flex;
            gap: 16px;
            cursor: pointer;
        }

        .hotel-card {
    position: relative;
}

        .hotel-card .image-slider {
    padding-right: 16px;
    border-right: 1px solid #e5e7eb;
}

.hotel-card .hotel-info {
    padding: 0 16px;
    border-right: 1px solid #e5e7eb;
}

.hotel-card .price-box {
    padding-left: 16px;
}

        .hotel-card:hover {
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        /* IMAGE SLIDER */
        .image-slider {
            width: 220px;
            height: 160px;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
        }

        .image-slider img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: none;
        }

        .image-slider img.active {
            display: block;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
        }

        .slider-btn.left { left: 6px; }
        .slider-btn.right { right: 6px; }

        /* INFO */
        .hotel-info { flex: 1; }

        .hotel-name {
            font-size: 20px;
            font-weight: 700;
            color: #0f2b5b;
        }

        .stars i { color: #f5b50a; }

        .address {
            font-size: 14px;
            color: #555;
        }

        .description {
            font-size: 14px;
            color: #444;
            margin-top: 6px;
        }

        /* PRICE */
        .price-box {
            width: 200px;
            text-align: right;
        }

        .old-price {
            text-decoration: line-through;
            color: #888;
            font-size: 14px;
        }

        .discount-label {
            background: #16a34a;
            color: #fff;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 4px;
        }

        .price {
            font-size: 22px;
            font-weight: 700;
            color: #e11d48;
        }

        .review-box {
            font-size: 14px;
            color: #444;
            margin-bottom: 8px;
        }

        #suggestions {
            position: absolute;
            width: 100%;
            color : black;
            background: #ffffff;
            border-radius: 10px;
            margin-top: 4px;
            list-style: none;
            padding: 0;
            display: none;
            z-index: 1000;
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        #suggestions li {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
        }

        #suggestions li:hover {
            background: #eef2ff;
        }

        .suggest-item {
            display: flex;
            gap: 12px;
        }

        .suggest-icon {
            font-size: 18px;
            color: #1e40af;
            margin-top: 2px;
        }

        .suggest-name {
            font-weight: 600;
            font-size: 14px;
        }

        .suggest-meta {
            font-size: 12px;
            color: #6b7280;
        }

    </style>
</head>

<body>

<div class="container mt-4">

    <form th:action="@{/api/v1/public/search/results}" th:object="${search}" method="post">

        <div class="search-bar mb-4">
            <div class="row g-3 align-items-end">
                <div class="col-md-4 position-relative">
                    <label>Destination</label>
                    <input id="keywordInput"
                           type="text"
                           th:field="*{keyword}"
                           class="form-control"
                           placeholder="Hotel, city, region, country..."
                           autocomplete="off"
                           required>

                    <ul id="suggestions"></ul>

                    <input type="hidden" th:field="*{cityId}" id="cityId">
                    <input type="hidden" th:field="*{regionId}" id="regionId">
                    <input type="hidden" th:field="*{countryId}" id="countryId">
                </div>
                <div class="col-md-2">
                    <label>Check-in</label>
                    <input type="date" class="form-control" th:field="*{checkIn}">
                </div>
                <div class="col-md-2">
                    <label>Check-out</label>
                    <input type="date" class="form-control" th:field="*{checkOut}">
                </div>
                <div class="col-md-2">
                    <label>Guests</label>
                    <input type="number" class="form-control" th:field="*{numberOfGuests}">
                </div>
                <div class="col-md-2 d-grid">
                    <button class="btn btn-warning btn-lg">Search</button>
                </div>
            </div>
        </div>

        <div class="row">

            <!-- FILTERS -->
            <div class="col-md-3">

                <!-- HOTEL TYPE -->
                <div class="filter-box mb-3">
                    <h6 class="fw-bold">Hotel Type</h6>
                    <div th:each="type : ${T(com.project.HotelManagementSystem.entity.constants.HotelType).values()}">
                        <label class="d-flex align-items-center gap-2">
                            <input type="checkbox"
                                   name="hotelTypes"
                                   th:value="${type}"
                                   th:checked="${search.hotelTypes != null and search.hotelTypes.contains(type)}"
                                   onchange="this.form.submit()">
                            <span th:text="${type}"></span>
                        </label>
                    </div>
                </div>

                <!-- MIN RATING -->
                <div class="filter-box mb-3">
                    <h6 class="fw-bold">Min Rating</h6>
                    <input type="number"
                           step="0.5"
                           class="form-control"
                           th:field="*{minRating}"
                           onchange="this.form.submit()">
                </div>

                <!-- PRICE RANGE -->
                <div class="filter-box mb-3">
                    <h6 class="fw-bold">Price Range</h6>
                    <input type="number"
                           placeholder="Min"
                           class="form-control mb-2"
                           th:field="*{minPrice}"
                           onchange="this.form.submit()">
                    <input type="number"
                           placeholder="Max"
                           class="form-control"
                           th:field="*{maxPrice}"
                           onchange="this.form.submit()">
                </div>

                <!-- ROOM TYPES -->
                <div class="filter-box mb-3">
                    <h6 class="fw-bold">Room Type</h6>
                    <div th:each="rt : ${roomTypes}">
                        <label class="d-flex align-items-center gap-2">
                            <input type="checkbox"
                                   name="roomTypeNames"
                                   th:value="${rt.name}"
                                   th:checked="${search.roomTypeNames != null and search.roomTypeNames.contains(rt.name)}"
                                   onchange="this.form.submit()">
                            <span th:text="${rt.name}"></span>
                        </label>
                    </div>
                </div>

                <!-- AMENITIES -->
                <div class="filter-box mb-3">
                    <h6 class="fw-bold">Amenities</h6>
                    <div th:each="a : ${amenities}">
                        <label class="d-flex align-items-center gap-2">
                            <input type="checkbox"
                                   name="amenities"
                                   th:value="${a.name}"
                                   th:checked="${search.amenities != null and search.amenities.contains(a.name)}"
                                   onchange="this.form.submit()">
                            <span th:text="${a.name}"></span>
                        </label>
                    </div>
                </div>

                <!-- PROMOTION -->
                <div class="filter-box">
                    <label class="d-flex align-items-center gap-2 fw-bold">
                        <input type="checkbox"
                               name="isPromotion"
                               value="true"
                               th:checked="${search.isPromotion}"
                               onchange="this.form.submit()">
                        Only hotels with promotion
                    </label>
                </div>

            </div>


            <!-- RESULTS -->
            <div class="col-md-9">

                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <div th:if="${hotels == null or #lists.isEmpty(hotels)}"
                     class="alert alert-warning">
                    No hotels found.
                </div>

                <div th:each="hotel : ${hotels}"
                     class="hotel-card"
                     th:onclick="|window.location='/hotel/'+${hotel.hotelId}|">

                    <!-- IMAGE SLIDER -->
                    <div class="image-slider" th:attr="data-slider-id=${hotel.hotelId}">
                        <img th:each="img, i : ${hotel.imageUrls}"
                             th:src="${img}"
                             th:classappend="${i.index == 0} ? 'active'">
                        <button type="button" class="slider-btn left"
                                onclick="slide(event, -1)">‹</button>
                        <button type="button" class="slider-btn right"
                                onclick="slide(event, 1)">›</button>
                    </div>


                    <!-- INFO -->
                    <div class="hotel-info">
                        <div class="hotel-name" th:text="${hotel.hotelName}"></div>

                        <div class="stars">
                            <span th:each="i : ${#numbers.sequence(1, T(java.lang.Math).floor(hotel.rating))}">
                                <i class="bi bi-star-fill"></i>
                            </span>
                            <span th:if="${hotel.rating % 1 >= 0.5}">
                                <i class="bi bi-star-half"></i>
                            </span>
                        </div>

                        <div class="address">
                            <i class="bi bi-geo-alt"></i>
                            <span th:text="${hotel.city + ', ' + hotel.region + ', ' + hotel.country}"></span>
                        </div>

                        <div class="description"
                             th:text="${#strings.abbreviate(hotel.description, 140)}">
                        </div>

                    </div>

                    <!-- PRICE -->
                    <div class="price-box">
                        <div class="review-box">
                            <strong th:text="${hotel.rating}"></strong> / 5<br>
                            <span th:text="${hotel.reviewCount + ' reviews'}"></span>
                        </div>

                        <div th:if="${hotel.discountLabel != null}"
                             class="discount-label"
                             th:text="${hotel.discountLabel}">
                        </div>

                        <div th:if="${hotel.originalPrice != hotel.discountedPrice}"
                             class="old-price">
                            $<span th:text="${hotel.originalPrice}"></span>
                        </div>

                        <div class="price">
                            $<span th:text="${hotel.discountedPrice}"></span>
                        </div>

<!--                        <div class="text-muted small"-->
<!--                             th:text="'Total for ' + ${hotel.nights} + ' nights'"></div>-->
                        <div class="text-muted small"
                             th:text="'Total for 1 night'"></div>
                    </div>

                </div>
            </div>
        </div>
    </form>
</div>

<!-- IMAGE SLIDER JS -->
<script>
    function slide(event, direction) {
        event.stopPropagation();

        const slider = event.target.closest(".image-slider");
        const images = slider.querySelectorAll("img");
        let index = Array.from(images).findIndex(img => img.classList.contains("active"));

        images[index].classList.remove("active");
        index = (index + direction + images.length) % images.length;
        images[index].classList.add("active");
    }

document.addEventListener("DOMContentLoaded", () => {

    const input = document.getElementById("keywordInput");
    const list = document.getElementById("suggestions");

    const cityId = document.getElementById("cityId");
    const regionId = document.getElementById("regionId");
    const countryId = document.getElementById("countryId");

    const iconMap = {
        HOTEL: "bi-building",
        CITY: "bi-buildings",
        REGION: "bi-geo-alt",
        COUNTRY: "bi-globe"
    };

    let timer = null;

    input.addEventListener("input", () => {
        clearTimeout(timer);

        const q = input.value.trim();

        cityId.value = "";
        regionId.value = "";
        countryId.value = "";

        if (!q) {
            list.style.display = "none";
            list.innerHTML = "";
            return;
        }

        timer = setTimeout(async () => {
            const res = await fetch(`/api/v1/public/search/autocomplete?q=${encodeURIComponent(q)}`);
            const data = await res.json();

            list.innerHTML = "";

            data.forEach(item => {
                const li = document.createElement("li");
                const icon = iconMap[item.type] || "bi-search";

                let meta = "";
                if (item.type === "HOTEL")
                    meta = `${item.cityName}, ${item.regionName}, ${item.countryName}`;
                if (item.type === "CITY")
                    meta = `${item.regionName}, ${item.countryName}`;
                if (item.type === "REGION")
                    meta = `${item.countryName}`;

                li.innerHTML = `
                    <div class="suggest-item">
                        <i class="bi ${icon} suggest-icon"></i>
                        <div>
                            <div class="suggest-name">${item.name}</div>
                            <div class="suggest-meta">
                                ${item.type}${meta ? " · " + meta : ""}
                            </div>
                        </div>
                    </div>
                `;

                li.onclick = () => {
                    input.value = item.name;
                    list.style.display = "none";

                    if (item.type === "CITY") cityId.value = item.cityId;
                    if (item.type === "REGION") regionId.value = item.regionId;
                    if (item.type === "COUNTRY") countryId.value = item.countryId;
                };

                list.appendChild(li);
            });

            list.style.display = data.length ? "block" : "none";
        }, 250);
    });

    document.addEventListener("click", e => {
        if (!e.target.closest(".position-relative")) {
            list.style.display = "none";
        }
    });
});

</script>

</body>
</html>
