<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${hotel.hotelName} + ' | Hotel Detail'">Hotel Detail</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body { background: #f4f7fb; }

        /* SEARCH BAR */
        .search-bar {
            background: linear-gradient(135deg, #0f2b5b, #1e4fa1);
            padding: 20px;
            border-radius: 12px;
            color: #fff;
        }

        /* CARD */
        .card-box {
            background: #fff;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        /* PHOTO GRID */
        .photo-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 10px;
        }

        .photo-grid img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            cursor: pointer;
        }

        /* AMENITIES */
        .amenities-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            font-size: 14px;
        }

        /* ROOM TABLE */
        .room-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .room-photo {
            width: 120px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
        }

        /* REVIEW SLIDER */
        .review-box {
            position: relative;
            padding-right: 40px;
        }

        .review-nav {
            position: absolute;
            right: 0;
            top: 0;
        }

        #suggestions {
            position: absolute;
            width: 100%;
            background: #fff;
            border-radius: 10px;
            list-style: none;
            padding: 0;
            display: none;
            z-index: 1000;
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        #suggestions li {
            padding: 10px 14px;
            cursor: pointer;
        }

        #suggestions li:hover {
            background: #eef2ff;
        }
    </style>
</head>

<body>

<div class="container mt-4">

    <form th:action="@{/api/v1/public/search/results}" th:object="${search}" method="post">
        <div class="search-bar mb-4">
            <div class="row g-3 align-items-end">
                <div class="col-md-4 position-relative">
                    <label>Destination</label>
                    <input id="keywordInput" type="text" th:field="*{keyword}"
                           class="form-control"
                           placeholder="Hotel, city, region, country..." autocomplete="off" required>
                    <ul id="suggestions"></ul>

                    <input type="hidden" th:field="*{cityId}" id="cityId">
                    <input type="hidden" th:field="*{regionId}" id="regionId">
                    <input type="hidden" th:field="*{countryId}" id="countryId">
                </div>

                <div class="col-md-2">
                    <label>Check-in</label>
                    <input type="date" class="form-control" th:field="*{checkIn}">
                </div>
                <div class="col-md-2">
                    <label>Check-out</label>
                    <input type="date" class="form-control" th:field="*{checkOut}">
                </div>
                <div class="col-md-2">
                    <label>Guests</label>
                    <input type="number" class="form-control" th:field="*{numberOfGuests}">
                </div>
                <div class="col-md-2 d-grid">
                    <button class="btn btn-warning btn-lg">Search</button>
                </div>
            </div>
        </div>
    </form>

    <div class="card-box">
        <div class="photo-grid">
            <img th:each="p, i : ${hotel.photos}"
                 th:if="${i.index < 3}"
                 th:src="${p.url}">
        </div>
        <button class="btn btn-outline-primary mt-3">
            View all photos
        </button>
    </div>

    <div class="row">
        <div class="col-md-8">
            <div class="card-box">
                <h3 th:text="${hotel.hotelName}"></h3>
                <p class="text-muted">
                    <i class="bi bi-geo-alt"></i>
                    <span th:text="${hotel.address}"></span>
                </p>

                <div class="amenities-list mt-3">
                    <div th:each="a : ${hotel.amenities}">
                        ✅ <span th:text="${a}"></span>
                    </div>
                </div>
            </div>

            <div class="card-box">
                <h5>About this property</h5>
                <p th:text="${hotel.description}"></p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card-box review-box">
                <h5>Guest Reviews</h5>
                <strong th:text="${hotel.rating}"></strong> / 5
                <p th:text="${hotel.reviewCount + ' reviews'}"></p>

                <div th:each="r : ${hotel.reviews}">
                    <hr>
                    <strong th:text="${r.customerName}"></strong>
                    <p th:text="${r.comment}"></p>
                </div>
            </div>
        </div>
    </div>


    <div class="card-box">
        <h4>Select your room</h4>

        <div th:each="room : ${hotel.rooms}" class="room-card row align-items-center">
            <div class="col-md-2">
                <img class="room-photo"
                     th:src="${room.photos[0].url}">
            </div>

            <div class="col-md-3">
                <strong th:text="${room.roomTypeName}"></strong><br>
                <small th:text="'Size: ' + ${room.roomSize} + ' sqm'"></small><br>
                <small th:text="'Capacity: ' + ${room.capacity}"></small>
            </div>

            <div class="col-md-3">
                <div th:each="a : ${room.amenities}">
                    ✅ <span th:text="${a}"></span>
                </div>
            </div>

            <div class="col-md-2 text-center">
                👨‍👩‍👧 Kids stay free
            </div>

            <div class="col-md-2 text-end">
                <strong>$<span th:text="${room.price}"></span></strong><br>
                <button class="btn btn-primary mt-2">Book</button>
            </div>
        </div>
    </div>

</div>


<script>
    document.addEventListener("DOMContentLoaded", () => {

        const input = document.getElementById("keywordInput");
        const list = document.getElementById("suggestions");

        const cityId = document.getElementById("cityId");
        const regionId = document.getElementById("regionId");
        const countryId = document.getElementById("countryId");

        let timer = null;

        input.addEventListener("input", () => {
            clearTimeout(timer);
            const q = input.value.trim();

            cityId.value = "";
            regionId.value = "";
            countryId.value = "";

            if (!q) {
                list.style.display = "none";
                list.innerHTML = "";
                return;
            }

            timer = setTimeout(async () => {
                const res = await fetch(`/api/v1/public/search/autocomplete?q=${encodeURIComponent(q)}`);
                const data = await res.json();

                list.innerHTML = "";

                data.forEach(item => {
                    const li = document.createElement("li");
                    li.textContent = item.name;
                    li.onclick = () => {
                        input.value = item.name;
                        list.style.display = "none";

                        if (item.type === "CITY") cityId.value = item.cityId;
                        if (item.type === "REGION") regionId.value = item.regionId;
                        if (item.type === "COUNTRY") countryId.value = item.countryId;
                    };
                    list.appendChild(li);
                });

                list.style.display = "block";
            }, 250);
        });
    });
</script>

</body>
</html>
