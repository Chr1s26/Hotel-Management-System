<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${hotel.hotelName} + ' | Hotel Detail'">Hotel Detail</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background: #f3f6fb;
            color: #1f2937;
            font-family: "Segoe UI", system-ui, -apple-system;
        }

        /* SEARCH BAR */
        .search-bar {
            background: linear-gradient(135deg, #0f2b5b, #1e4fa1);
            padding: 18px;
            border-radius: 14px;
            color: #fff;
        }

        /* SECTION CARD */
        .section-card {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin-bottom: 24px;
        }

        /* HERO PHOTO GRID */
        .photo-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 10px;
        }

        .photo-grid img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .photo-grid img:hover {
            transform: scale(1.03);
        }

        /* HOTEL HEADER */
        .hotel-title {
            font-size: 26px;
            font-weight: 700;
        }

        .hotel-rating {
            color: #f59e0b;
            font-weight: 600;
        }

        /* AMENITIES CHIPS */
        .amenities-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }

        .amenity-chip {
            background: #eef2ff;
            color: #1e40af;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 999px;
            font-weight: 500;
        }

        /* REVIEW CARD */
        .review-card {
            background: #f9fafb;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
        }

        /* ROOM ROW */
        .room-row {
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            gap: 16px;
            align-items: center;
            background: #fff;
            transition: box-shadow 0.3s ease;
        }

        .room-row:hover {
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .room-photo {
            width: 120px;
            height: 90px;
            border-radius: 10px;
            object-fit: cover;
        }

        .room-meta {
            flex: 1;
        }

        .room-title {
            font-weight: 700;
            font-size: 16px;
        }

        .room-amenities {
            font-size: 13px;
            color: #4b5563;
        }

        .price-box {
            text-align: right;
            min-width: 140px;
        }

        .price {
            font-size: 20px;
            font-weight: 700;
            color: #dc2626;
        }

        .book-btn {
            margin-top: 6px;
            border-radius: 999px;
            padding: 6px 18px;
        }

        .property-meta {
            display: flex;
            gap: 18px;
            font-size: 14px;
            color: #374151;
            margin-top: 10px;
        }

        .policy-item {
            padding: 14px 0;
            border-bottom: 1px dashed #e5e7eb;
        }

        .policy-title {
            font-weight: 600;
            font-size: 15px;
        }

        .policy-desc {
            font-size: 14px;
            color: #4b5563;
            margin-top: 4px;
        }

        .policy-applicable {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }

    </style>


</head>

<body>

<div class="container mt-4">

    <form th:action="@{/api/v1/public/search/results}" th:object="${search}" method="post">
        <div class="search-bar mb-4">
            <div class="row g-3 align-items-end">
                <div class="col-md-4 position-relative">
                    <label>Destination</label>
                    <input id="keywordInput" type="text" th:field="*{keyword}"
                           class="form-control"
                           placeholder="Hotel, city, region, country..." autocomplete="off" required>
                    <ul id="suggestions"></ul>

                    <input type="hidden" th:field="*{cityId}" id="cityId">
                    <input type="hidden" th:field="*{regionId}" id="regionId">
                    <input type="hidden" th:field="*{countryId}" id="countryId">
                </div>

                <div class="col-md-2">
                    <label>Check-in</label>
                    <input type="date" class="form-control" th:field="*{checkIn}">
                </div>
                <div class="col-md-2">
                    <label>Check-out</label>
                    <input type="date" class="form-control" th:field="*{checkOut}">
                </div>
                <div class="col-md-2">
                    <label>Guests</label>
                    <input type="number" class="form-control" th:field="*{numberOfGuests}">
                </div>
                <div class="col-md-2 d-grid">
                    <button class="btn btn-warning btn-lg">Search</button>
                </div>
            </div>
        </div>
    </form>

    <div class="section-card">
        <div class="photo-grid">
            <img th:each="p, i : ${hotel.photos}"
                 th:if="${i.index < 3}"
                 th:src="${p.url}">
        </div>

        <div class="text-end mt-3">
            <button class="btn btn-outline-primary btn-sm">
                View all photos
            </button>
        </div>
    </div>


    <div class="row">
        <div class="col-md-8">
            <div class="section-card">
                <div class="hotel-title" th:text="${hotel.hotelName}"></div>

                <div class="hotel-rating mt-1">
                    ⭐ <span th:text="${hotel.rating}"></span> ·
                    <span th:text="${hotel.reviewCount + ' reviews'}"></span>
                </div>

                <div class="text-muted mt-1">
                    <i class="bi bi-geo-alt"></i>
                    <span th:text="${hotel.address}"></span>
                </div>

                <div class="amenities-list">
                    <div th:each="a : ${hotel.amenities}" class="amenity-chip">
                        ✔ <span th:text="${a}"></span>
                    </div>
                </div>
            </div>


            <div class="section-card description-card">
                <div class="description-header">
                    <i class="bi bi-info-circle-fill"></i>
                    <h5>Description</h5>
                </div>

                <div class="description-text"
                     th:text="${hotel.description}">
                </div>
            </div>

        </div>

        <div class="col-md-4">
            <div class="section-card">
                <h5 class="mb-3">Guest Reviews</h5>

                <div th:each="r : ${hotel.reviews}" class="review-card">
                    <strong th:text="${r.customerName}"></strong>
                    <div class="text-muted small" th:text="${r.rating + ' / 5'}"></div>
                    <p class="mt-2 mb-0" th:text="${r.comment}"></p>
                </div>
            </div>

        </div>
    </div>


    <div class="section-card">
        <h4 class="mb-3">Select your room</h4>

        <div th:each="room : ${hotel.rooms}" class="room-row">

            <img class="room-photo"
                 th:src="${room.photos[0].url}">

            <div class="room-meta">
                <div class="room-title" th:text="${room.roomTypeName}"></div>
                <div class="text-muted small">
                    Size: <span th:text="${room.roomSize}"></span> sqm ·
                    Capacity: <span th:text="${room.capacity}"></span>
                </div>

                <div class="room-amenities mt-1">
                    👨‍👩‍👧 Kids stay free
                </div>
            </div>

            <div class="price-box">
                <div class="price">$<span th:text="${room.price}"></span></div>
                <button class="btn btn-primary btn-sm book-btn">Book</button>
            </div>

        </div>
    </div>

    <div class="section-card">
        <div class="description-header">
            <i class="bi bi-building"></i>
            <h5>Property Information</h5>
        </div>

        <div class="property-meta">
            <div th:if="${hotel.numberOfRooms != null}">
                🛏 <strong th:text="${hotel.numberOfRooms}"></strong> rooms
            </div>
            <div th:if="${hotel.openingDate != null}">
                🏗 Opened in <span th:text="${hotel.openingDate.year}"></span>
            </div>
            <div th:if="${hotel.renovationDate != null}">
                🔧 Renovated in <span th:text="${hotel.renovationDate.year}"></span>
            </div>
        </div>

        <p class="description-text mt-3"
           th:text="${hotel.propertyDescription}">
        </p>
    </div>

    <div class="section-card">
        <div class="description-header">
            <i class="bi bi-shield-check"></i>
            <h5>Hotel Policies</h5>
        </div>

        <div th:if="${hotel.policies == null || hotel.policies.isEmpty()}"
             class="text-muted small">
            No special policies provided by the hotel.
        </div>

        <div th:each="p : ${hotel.policies}" class="policy-item">
            <div class="policy-title" th:text="${p.title}"></div>
            <div class="policy-desc" th:text="${p.description}"></div>
            <div class="policy-applicable"
                 th:if="${p.applicableTo != null}">
                Applies to: <span th:text="${p.applicableTo}"></span>
            </div>
        </div>
    </div>


</div>


<script>
    document.addEventListener("DOMContentLoaded", () => {

        const input = document.getElementById("keywordInput");
        const list = document.getElementById("suggestions");

        const cityId = document.getElementById("cityId");
        const regionId = document.getElementById("regionId");
        const countryId = document.getElementById("countryId");

        let timer = null;

        input.addEventListener("input", () => {
            clearTimeout(timer);
            const q = input.value.trim();

            cityId.value = "";
            regionId.value = "";
            countryId.value = "";

            if (!q) {
                list.style.display = "none";
                list.innerHTML = "";
                return;
            }

            timer = setTimeout(async () => {
                const res = await fetch(`/api/v1/public/search/autocomplete?q=${encodeURIComponent(q)}`);
                const data = await res.json();

                list.innerHTML = "";

                data.forEach(item => {
                    const li = document.createElement("li");
                    li.textContent = item.name;
                    li.onclick = () => {
                        input.value = item.name;
                        list.style.display = "none";

                        if (item.type === "CITY") cityId.value = item.cityId;
                        if (item.type === "REGION") regionId.value = item.regionId;
                        if (item.type === "COUNTRY") countryId.value = item.countryId;
                    };
                    list.appendChild(li);
                });

                list.style.display = "block";
            }, 250);
        });
    });
</script>

</body>
</html>
