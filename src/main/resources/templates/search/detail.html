<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hotel Detail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/form-theme.css}">
</head>

<body class="royal-form-page">
<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="container mt-4">
    <h2 th:text="${hotel.name}"></h2>
    <p class="text-muted" th:text="${hotel.city + ', ' + hotel.country}"></p>

    <h4 class="mt-4">Available Room Types</h4>

    <div class="glass-card p-3 mb-3"
         th:each="rt : ${roomTypes}">

        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h5 th:text="${rt.name}"></h5>
                <p>
                    Capacity: <span th:text="${rt.capacity}"></span> |
                    Size: <span th:text="${rt.roomSize}"></span> people
                </p>
            </div>

            <div class="text-end">
                <p class="fw-bold fs-5">
                    <span th:text="${rt.price}"></span> / night
                </p>

                <form th:action="@{/bookings/create}" method="post">
                    <input type="hidden" name="roomTypeId" th:value="${rt.id}">
                    <input type="hidden" name="hotelId" th:value="${hotel.id}">
                    <input type="hidden" name="checkIn" th:value="${param.checkIn}">
                    <input type="hidden" name="checkOut" th:value="${param.checkOut}">
                    <input type="hidden" name="guests" th:value="${param.guests}">

                    <button class="btn btn-success">
                        Book Now
                    </button>
                </form>
            </div>
        </div>

    </div>
</div>
</body>
</html>
