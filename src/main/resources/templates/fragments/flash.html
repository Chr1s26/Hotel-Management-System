<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Drop near the top of a listing page: <div th:replace="~{fragments/flash :: flash}"></div> -->
<div th:fragment="flash">
    <div th:if="${alertMessage}" class="alert alert-warning mt-2" role="alert" th:text="${alertMessage}"></div>
    <div th:if="${successMessage}" class="alert alert-success mt-2" role="alert" th:text="${successMessage}"></div>
</div>
</body>
</html>
