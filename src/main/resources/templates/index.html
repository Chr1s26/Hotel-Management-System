<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Search Index</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/form-theme.css}">
</head>

<body class="royal-form-page">

<!-- Sidebar (EXACT same as editors page) -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- Page content -->
<div class="container mt-4">

    <h2>Search Index</h2>

    <!-- Success message -->
    <div class="alert alert-success"
         th:if="${param.success}">
        Elasticsearch reindex completed successfully.
    </div>

    <!-- Description block (same style as listing tools) -->
    <div class="mb-4">
        <p>
            This tool rebuilds the Elasticsearch index for:
        </p>
        <ul>
            <li>Countries</li>
            <li>Regions</li>
            <li>Cities</li>
            <li>Hotels</li>
        </ul>
        <p>
            Use this only when search results are outdated or after bulk data changes.
        </p>
    </div>


    <!-- Action button (same size/feel as “Add Editor”) -->
    <form th:action="@{/reindex}" method="post">
        <button type="submit" class="btn btn-danger btn-sm">
            Reindex All Locations
        </button>
    </form>

</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- EXACT same sidebar toggle script -->
<script>
    (function() {
        const toggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('appSidebar');
        const body = document.querySelector('body');

        if (!sidebar) return;

        function setCollapsed(collapsed) {
            if (collapsed) {
                sidebar.classList.add('sidebar-collapsed');
                body.classList.remove('content-with-sidebar');
                body.classList.add('content-no-sidebar');
            } else {
                sidebar.classList.remove('sidebar-collapsed');
                body.classList.remove('content-no-sidebar');
                body.classList.add('content-with-sidebar');
            }
            try { localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0'); } catch(e) {}
        }

        const saved = localStorage.getItem('sidebarCollapsed');
        setCollapsed(saved === '1');

        if (toggle) {
            toggle.addEventListener('click', function () {
                const isCollapsed = sidebar.classList.contains('sidebar-collapsed');
                setCollapsed(!isCollapsed);
            });
        }

        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 991.98) {
                if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
                    setCollapsed(true);
                }
            }
        });
    })();
</script>

</body>
</html>
