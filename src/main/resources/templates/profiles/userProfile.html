<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background-color: #2E4053;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding-top: 80px;
        }
        .profile-container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .profile-header {
            background: linear-gradient(to right, #1976d2, #42a5f5);
            color: white;
            text-align: center;
            padding: 40px 20px;
        }
        .profile-header img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
            margin-bottom: 15px;
        }
        .profile-header h2 {
            margin-bottom: 5px;
        }
        .profile-body {
            padding: 30px;
        }
        .profile-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 30px;
        }
        .profile-info div {
            background: white;
            padding: 12px 18px;
            border-radius: 8px;
        }
        .profile-info span.label {
            font-weight: 600;
            color: #555;
        }
        .upload-form {
            text-align: center;
            margin-top: 25px;
        }
        .upload-form input[type="file"] {
            display: none;
        }
        .upload-form label {
            background-color: #1976d2;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .upload-form label:hover {
            background-color: #1565c0;
        }
        .btn-update {
            background-color: #ffb300;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-update:hover {
            background-color: #ffa000;
        }
    </style>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="profile-container">
    <div class="profile-header">
        <img th:src="@{${profilePhoto.profileUrl}}" alt="Profile Picture">
        <h2 th:text="${profile.name}"></h2>
        <p th:text="${user.email}"></p>
        <p th:text="${userType} + ' Account'"></p>

        <form th:action="@{/profiles/updatePicture}" th:object="${request}" method="post" enctype="multipart/form-data" class="upload-form">
            <input type="file" id="fileInput" th:field="*{file}"  accept="image/*">
            <label for="fileInput">Change Profile Picture</label>
            <button type="submit" class="btn-update">Upload</button>
        </form>
    </div>

    <div class="profile-body">
        <div class="profile-info">
            <div><span class="label">Name:</span> <span th:text="${profile.name}"></span></div>
            <div><span class="label">Phone:</span> <span th:text="${profile.phone}"></span></div>
            <div><span class="label">Date of Birth:</span> <span th:text="${profile.dateOfBirth}"></span></div>
            <div><span class="label">Nationality:</span> <span th:text="${profile.nationality}"></span></div>
            <div><span class="label">Passport No:</span> <span th:text="${profile.passportNumber}"></span></div>
            <div><span class="label">National ID:</span> <span th:text="${profile.nationalIdNumber}"></span></div>

            <div th:if="${userType == 'ADMIN'}">
                <span class="label">Admin Type:</span> <span th:text="${profile.adminType}"></span>
            </div>

            <div th:if="${userType == 'EDITOR'}">
                <span class="label">Editor Type:</span> <span th:text="${profile.editorType}"></span>
            </div>

            <div><span class="label">Status:</span> <span th:text="${profile.status}"></span></div>
        </div>
    </div>
</div>

</body>
</html>
