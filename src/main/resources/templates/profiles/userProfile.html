<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Profile</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Theme CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/form-theme.css}">

    <style>
        /* 🌌 Background */
        body {
            background: linear-gradient(135deg, var(--royal), var(--navy));
            color: var(--soft);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding-top: 80px;
        }

        /* 💎 Profile container */
        .profile-container {
            max-width: 900px;
            margin: 60px auto;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(20, 32, 46, 0.7);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(136,169,195,0.35);
            box-shadow: 0 12px 30px rgba(0,0,0,0.45);
        }

        /* 🌈 Header */
        .profile-header {
            background: linear-gradient(to right, var(--midnight), var(--royal));
            text-align: center;
            color: var(--soft);
            padding: 40px 20px;
            border-bottom: 1px solid rgba(136,169,195,0.2);
        }

        .profile-header img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid var(--bluegray);
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 0 12px rgba(136,169,195,0.5);
        }

        .profile-header h2 {
            font-weight: 600;
            color: var(--bluegray);
            margin-bottom: 5px;
        }

        .profile-header p {
            color: var(--soft2);
            margin-bottom: 6px;
        }

        /* 📋 Body section */
        .profile-body {
            padding: 30px;
        }

        .profile-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px 28px;
        }

        .profile-info div {
            background: rgba(43,66,87,0.4);
            padding: 14px 20px;
            border-radius: 10px;
            color: var(--soft);
            border: 1px solid rgba(136,169,195,0.25);
            transition: background-color .2s;
        }

        .profile-info div:hover {
            background: rgba(43,66,87,0.6);
        }

        .label {
            font-weight: 600;
            color: var(--bluegray);
        }

        /* 📤 Upload form */
        .upload-form {
            text-align: center;
            margin-top: 25px;
        }

        .upload-form input[type="file"] {
            display: none;
        }

        .upload-form label {
            background: var(--bluegray);
            color: var(--royal);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
        }

        .upload-form label:hover {
            background: #9db8cf;
        }

        .btn-update {
            background: var(--midnight);
            color: var(--soft);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-left: 6px;
            font-weight: 600;
        }

        .btn-update:hover {
            background: var(--royal);
        }

        /* Navbar layering fix */
        .navbar { z-index: 1050 !important; }
        .dropdown-menu { z-index: 2000 !important; }
    </style>
</head>
<body class="royal-form-page">
<div th:replace="fragments/sidebar :: sidebar"></div>
<div class="container mt-4">
    <div class="profile-container">
        <div class="profile-header">
            <img th:src="@{${profilePhoto.profileUrl}}" alt="Profile Picture">
            <h2 th:text="${profile.name}"></h2>
            <p th:text="${user.email}"></p>
            <p th:text="${userType} + ' Account'"></p>

            <form th:action="@{/profiles/updatePicture}" th:object="${request}" method="post" enctype="multipart/form-data" class="upload-form no-card">
                <input type="file" id="fileInput" th:field="*{file}" accept="image/*">
                <label for="fileInput">Change Profile Picture</label>
                <button type="submit" class="btn-update">Upload</button>
            </form>
        </div>

        <div class="profile-body" th:if="${userType == 'ADMIN'}">
            <div class="profile-info">
                <div><span class="label">Name:</span> <span th:text="${profile.name}"></span></div>
                <div><span class="label">Phone:</span> <span th:text="${profile.phone}"></span></div>
                <div><span class="label">Date of Birth:</span> <span th:text="${profile.dateOfBirth}"></span></div>
                <div><span class="label">Nationality:</span> <span th:text="${profile.nationality}"></span></div>
                <div><span class="label">Passport No:</span> <span th:text="${profile.passportNumber}"></span></div>
                <div><span class="label">National ID:</span> <span th:text="${profile.nationalIdNumber}"></span></div>

                <div th:if="${userType == 'ADMIN'}">
                    <span class="label">Admin Type:</span> <span th:text="${profile.adminType}"></span>
                </div>

                <div th:if="${userType == 'EDITOR'}">
                    <span class="label">Editor Type:</span> <span th:text="${profile.editorType}"></span>
                </div>

                <div><span class="label">Status:</span> <span th:text="${profile.status}"></span></div>
            </div>
        </div>
    </div>

    <div class="profile-body" th:if="${userType == 'NORMAL USER'}">
        <div class="profile-info">
            <div><span class="label">Name:</span> <span th:text="${profile.name}"></span></div>
            <div><span class="label">Email:</span> <span th:text="${profile.email}"></span></div>

            <div><span class="label">Status:</span> <span th:text="${profile.status}"></span></div>
        </div>
    </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function() {
        const toggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('appSidebar');
        const body = document.querySelector('body');

        if (!sidebar) return;
        const savedState = localStorage.getItem("sidebar-collapsed") === "true";

        function setCollapsed(collapsed) {
            if (collapsed) {
                sidebar.classList.add('sidebar-collapsed');
                body.classList.remove('content-with-sidebar');
                body.classList.add('content-no-sidebar');
            } else {
                sidebar.classList.remove('sidebar-collapsed');
                body.classList.remove('content-no-sidebar');
                body.classList.add('content-with-sidebar');
            }
            try { localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0'); } catch(e) {}
        }

        const saved = localStorage.getItem('sidebarCollapsed');
        setCollapsed(saved === '1');

        if (toggle) {
            toggle.addEventListener('click', function () {
                const isCollapsed = sidebar.classList.contains('sidebar-collapsed');
                setCollapsed(!isCollapsed);
            });
        }

        // close sidebar on small screens when clicking outside
        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 991.98) {
                if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
                    setCollapsed(true);
                }
            }
        });
    })();
</script>
</body>
</html>
