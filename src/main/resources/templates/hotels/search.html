<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hotel Search</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/form-theme.css}">

    <style>
        body {
            background: linear-gradient(135deg, #0b1a33, #0f213f);
            color: #fff;
        }

        /* Center container width */
        .search-wrapper {
            max-width: 600px;
            margin: 80px auto;
        }

        /* Glass dark card */
        .search-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 35px 40px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        h2 {
            text-align: center;
            color: #d7e9ff;
            font-weight: 600;
            margin-bottom: 25px;
        }

        /* Input styling */
        .form-control {
            background: rgba(255, 255, 255, 0.12) !important;
            border: 1px solid rgba(255, 255, 255, 0.25) !important;
            color: #e8f1ff !important;
            border-radius: 10px;
            padding: 12px 15px;
            transition: 0.25s;
        }

        .form-control::placeholder {
            color: rgba(230, 235, 255, 0.55);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.18) !important;
            border-color: #5aaaff !important;
            box-shadow: 0 0 10px rgba(90, 170, 255, 0.5);
        }

        /* Search button (premium blue) */
        .btn-search {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            background: #4a8fff;
            border: none;
            color: white;
            transition: 0.2s;
        }

        .btn-search:hover {
            background: #3f7be0;
            box-shadow: 0 0 12px rgba(67, 137, 255, 0.7);
        }

        /* Autocomplete dropdown */
        #suggestions {
            position: absolute;
            top: 48px;
            width: 100%;
            background: rgba(15, 30, 55, 0.95);
            border-radius: 12px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.4);
            list-style: none;
            padding: 0;
            display: none;
            overflow: hidden;
            z-index: 999;
            border: 1px solid rgba(255,255,255,0.15);
        }

        #suggestions li {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            color: #cfe3ff;
            transition: 0.2s;
        }

        #suggestions li:hover {
            background: rgba(78, 142, 255, 0.25);
        }
    </style>
</head>

<body class="royal-form-page">

<!-- Sidebar -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="container search-wrapper">

    <h2>Search Hotels</h2>

<!--    <div class="search-card">-->

        <form th:action="@{/hotels}" method="post">

            <!-- Hidden values for your HotelQuery -->
            <input type="hidden" name="filterList[0].field" value="NAME">
            <input type="hidden" name="filterList[0].matchType" value="CONTAINS">

            <div class="mb-4 position-relative">
                <label class="form-label">Hotel Name</label>
                <input id="hotelSearch" type="text"
                       name="filterList[0].value"
                       class="form-control"
                       placeholder="Start typing..."
                       autocomplete="off">

                <ul id="suggestions"></ul>
            </div>

            <button type="submit" class="btn btn-search">Search</button>
        </form>
    </div>
<!--</div>-->

<script>
    const input = document.getElementById("hotelSearch");
    const list  = document.getElementById("suggestions");
    let timer = null;

    input.addEventListener("input", () => {
        clearTimeout(timer);

        const q = input.value.trim();
        if (q.length < 2) {
            list.style.display = "none";
            list.innerHTML = "";
            return;
        }

        timer = setTimeout(async () => {
            const res = await fetch(`/api/v1/hotels/autocomplete-search?q=${encodeURIComponent(q)}&field=NAME`);
            const data = await res.json();
            const hotels = data.hotelSearchDocumentList || [];

            list.innerHTML = "";
            hotels.forEach(h => {
                const li = document.createElement("li");
                li.textContent = h.name;
                li.onclick = () => {
                    input.value = h.name;
                    list.style.display = "none";
                };
                list.appendChild(li);
            });

            list.style.display = hotels.length ? "block" : "none";
        }, 250);
    });

    document.addEventListener("click", (e) => {
        if (!e.target.closest(".position-relative")) {
            list.style.display = "none";
        }
    });
</script>

</body>
</html>
