<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hotel List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/form-theme.css}">

</head>
<body class="container mt-4">
<div th:replace="fragments/navbar :: navbar"></div>
<h2>Hotels</h2>
<div class="d-flex justify-content-between align-items-center my-3">

    <div>
        Page <span th:text="${response.pageNumber + 1}">1</span> of
        <span th:text="${response.totalPages}">X</span> —
        Total: <span th:text="${response.totalElements}">Y</span> hotels
    </div>

    <div>
        <a class="btn btn-primary btn-lg" th:href="@{/hotels/new}">Add Hotels</a>
    </div>
</div>
<table class="table table-bordered">
    <thead>
    <tr><th>ID</th><th>Name</th><th>Phone Number</th><th>Email</th><th>Description</th><th>Rating</th><th>Hotel Type</th><th>Address</th><th>Property Description</th><th>Policies</th><th>Promotions</th><th>ACTIONS</th></tr>
    </thead>
    <tbody>
    <tr th:each="hotel : ${hotels}">
        <td th:text="${hotel.id}"></td>
        <td th:text="${hotel.name}"></td>
        <td th:text="${hotel.phoneNumber}"></td>
        <td th:text="${hotel.email}"></td>
        <td th:text="${hotel.description}"></td>
        <td th:text="${hotel.rating}"></td>
        <td th:text="${hotel.hotelType}"></td>
        <td th:text="${hotel.address}"></td>
        <td th:text="${hotel.propertyDescription}"></td>
        <td>
            <ul class="list-unstyled mb-0" th:if="${hotel.policies != null}">
                <li th:each="h : ${hotel.policies}" th:text="${h.description}"></li>
            </ul>
        </td>
        <td>
            <ul class="list-unstyled mb-0" th:if="${hotel.promotions != null}">
                <li th:each="h : ${hotel.promotions}" th:text="${h.code}"></li>
            </ul>
        </td>
        <td>
            <a class="btn btn-sm btn-warning" th:href="@{'/hotels/edit/' + ${hotel.id}}">Edit</a>
            <a class="btn btn-sm btn-danger" th:href="@{'/hotels/delete/' + ${hotel.id}}">Delete</a>
        </td>
    </tr>
    </tbody>
</table>
<form th:action="@{/hotels}" method="get" class="row align-items-center justify-content-between mt-4 mb-3 no-card" >
    <!-- Page size selector -->
    <div class="col-md-4">
        <label for="pageSize" class="form-label">Show</label>
        <select id="pageSize" class="form-select d-inline w-auto" name="pageSize" onchange="this.form.submit()">
            <option th:value="3" th:selected="${response.pageSize == 3}">3</option>
            <option th:value="6" th:selected="${response.pageSize == 6}">6</option>
            <option th:value="9" th:selected="${response.pageSize == 9}">9</option>
        </select>
        <span>per page</span>

        <!-- Hidden inputs -->
        <input type="hidden" name="pageNumber" th:value="${response.pageNumber}" />
        <input type="hidden" name="sortBy" th:value="${sortBy}" />
        <input type="hidden" name="sortOrder" th:value="${sortOrder}" />
    </div>

    <!-- Pagination links -->
    <div class="col-md-8 text-end">
        <nav class="d-flex justify-content-end mt-2">
            <ul class="pagination">
                <li class="page-item" th:classappend="${response.pageNumber == 0} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/hotels(pageNumber=${response.pageNumber - 1}, pageSize=${response.pageSize}, sortBy=${sortBy}, sortOrder=${sortOrder})}">Previous</a>
                </li>

                <li class="page-item" th:each="i : ${#numbers.sequence(0, response.totalPages - 1)}"
                    th:classappend="${i == response.pageNumber} ? 'active'">
                    <a class="page-link"
                       th:href="@{/hotels(pageNumber=${i}, pageSize=${response.pageSize}, sortBy=${sortBy}, sortOrder=${sortOrder})}"
                       th:text="${i + 1}">1</a>
                </li>

                <li class="page-item" th:classappend="${response.pageNumber + 1 >= response.totalPages} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/hotels(pageNumber=${response.pageNumber + 1}, pageSize=${response.pageSize}, sortBy=${sortBy}, sortOrder=${sortOrder})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>
</form>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
