<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Promotion List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/form-theme.css}">
</head>
<body class="royal-form-page">
<div th:replace="fragments/sidebar :: sidebar"></div>
<div class="container mt-4">

    <h2>Promotions</h2>

    <form th:action="@{/promotions}" th:object="${query}" method="post" class="row g-3 align-items-end mb-4 no-card">

        <div class="col-md-3">
            <label for="searchCode" class="form-label">Code</label>
            <input type="hidden" th:name="*{filterList[0].field}" th:value="'CODE'">
            <input type="hidden" th:name="*{filterList[0].matchType}" th:value="'CONTAINS'">
            <input type="text" id="searchCode" name="code" class="form-control" th:field="*{filterList[0].value}" placeholder="Search by code">
        </div>

        <div class="col-md-3">
            <label for="searchDiscountType" class="form-label">Discount Type</label>
            <input type="hidden" th:name="*{filterList[1].field}" th:value="'DISCOUNT_TYPE'">
            <input type="hidden" th:name="*{filterList[1].matchType}" th:value="'EXACT'">
            <select th:field="*{filterList[1].value}" id="searchDiscountType" name="discountType" class="form-select">
                <option value="">All</option>
                <option value="PERCENTAGE">Percentage</option>
                <option value="FIXED_AMOUNT">Fixed Amount</option>
            </select>
        </div>

        <div class="col-md-3">
            <label for="searchDiscountAmount" class="form-label">Discount Amount</label>
            <input type="hidden" th:name="*{filterList[2].field}" th:value="'DISCOUNT_AMOUNT'">
            <input type="hidden" th:name="*{filterList[2].matchType}" th:value="'EXACT'">
            <input type="text" id="searchDiscountAmount" name="discountAmount" class="form-control"
                   th:field="*{filterList[2].value}" placeholder="Search by discount amount">
        </div>

        <div class="col-md-3">
            <label for="searchStartDate" class="form-label">Start Date</label>
            <input type="hidden" th:name="*{filterList[3].field}" th:value="'START_DATE'">
            <input type="hidden" th:name="*{filterList[3].matchType}" th:value="'EXACT'">
            <input type="date" id="searchStartDate" name="startDate" class="form-control"
                   th:field="*{filterList[3].value}" placeholder="Search by start date">
        </div>

        <div class="col-md-3">
            <label for="searchEndDate" class="form-label">End Date</label>
            <input type="hidden" th:name="*{filterList[4].field}" th:value="'END_DATE'">
            <input type="hidden" th:name="*{filterList[4].matchType}" th:value="'EXACT'">
            <input type="date" id="searchEndDate" name="endDate" class="form-control"
                   th:field="*{filterList[4].value}" placeholder="Search by end date">
        </div>

        <div class="col-md-3">
            <label for="searchStatus" class="form-label">Status</label>
            <input type="hidden" th:name="*{filterList[5].field}" th:value="'STATUS'">
            <input type="hidden" th:name="*{filterList[5].matchType}" th:value="'EXACT'">
            <select th:field="*{filterList[5].value}" id="searchStatus" name="statusType" class="form-select">
                <option value="">All</option>
                <option value="ACTIVE">ACTIVE</option>
                <option value="DELETED">DELETED</option>
            </select>
        </div>
        

        <div class="col-md-3">
            <label class="form-label">Sort By</label>
            <select th:field="*{sortBy}" class="form-select" >
                <option value="code">Code</option>
                <option value="discountType">Discount type</option>
                <option value="discountAmount">Discount Amount</option>
                <option value="startDate">Start Date</option>
                <option value="endDate">End Date</option>
                <option value="status">Status</option>
                <option value="createdAt">Created Date</option>
            </select>
        </div>

        <div class="col-md-3">
            <label class="form-label">Order</label>
            <select th:field="*{sortDirection}" class="form-select">
                <option value="ASC">Ascending</option>
                <option value="DESC">Descending</option>
            </select>
        </div>

        <div class="col-md-3 d-flex align-items-end">
            <button type="submit" class="btn btn-primary me-2">Search</button>
            <a th:href="@{/promotions}" class="btn btn-secondary">Reset</a>
        </div>
    </form>

    <div th:if="${exportError}" class="alert alert-danger mt-2">
        <span th:text="${exportError}"></span>
    </div>

    <form th:action="@{/promotions/export/excel}" th:object="${query}" method="post" style="all: unset; display: inline;">
        <input type="hidden" th:each="f, iStat : ${query.filterList}"
               th:name="|filterList[${iStat.index}].field|" th:value="${f.field}">
        <input type="hidden" th:each="f, iStat : ${query.filterList}"
               th:name="|filterList[${iStat.index}].matchType|" th:value="${f.matchType}">
        <input type="hidden" th:each="f, iStat : ${query.filterList}"
               th:name="|filterList[${iStat.index}].value|" th:value="${f.value}">

        <!-- Sort info -->
        <input type="hidden" th:field="*{sortBy}">
        <input type="hidden" th:field="*{sortDirection}">

        <button type="submit" class="btn btn-success mb-3">
            <i class="bi bi-file-earmark-excel"></i> Export to Excel
        </button>
    </form>


    <div class="d-flex justify-content-between align-items-center my-3">

        <div>
            Page <span th:text="${query.pageNumber + 1}">1</span> of
            <span th:text="${totalPages}">X</span> —
            Total: <span th:text="${totalElements}">Y</span> promotions
        </div>

        <div>
            <a class="btn btn-primary btn-lg" th:href="@{/promotions/new}">Add Promotions</a>
        </div>
    </div>
    <table class="table table-bordered">
        <thead>
        <tr><th>ID</th><th>Code</th><th>Discount Type</th><th>Discount Amount</th><th>Start Date</th><th>End Date</th><th>Point Amount</th><th>Usage Limit</th><th>Times Used</th><th>Status</th><th>ACTIONS</th></tr>
        </thead>
        <tbody>
        <tr th:each="pro : ${promotions}">
            <td th:text="${pro.id}"></td>
            <td th:text="${pro.code}"></td>
            <td th:text="${pro.discountType}"></td>
            <td th:text="${pro.discountAmount}"></td>
            <td th:text="${pro.startDate}"></td>
            <td th:text="${pro.endDate}"></td>
            <td th:text="${pro.pointAmount}"></td>
            <td th:text="${pro.usageLimit}"></td>
            <td th:text="${pro.timesUsed}"></td>
            <td th:text="${pro.status}"></td>
            <td>
                <a class="btn btn-sm btn-view" th:href="@{'/promotions/view/' + ${pro.id}}">View</a>
                <a class="btn btn-sm btn-warning" th:href="@{'/promotions/edit/' + ${pro.id}}">Edit</a>
                <div th:replace="~{fragments/delete-control :: deleteControl('/promotions', ${pro.id})}"></div>
            </td>
        </tr>
        </tbody>
    </table>

    <form th:action="@{/promotions}" method="get" class="row align-items-center justify-content-between mt-4 mb-3 no-card">
        <!-- Page size selector -->
        <div class="col-md-4">
            <label for="pageSize" class="form-label">Show</label>
            <select id="pageSize" class="form-select d-inline w-auto" name="pageSize" onchange="this.form.submit()">
                <option th:value="3" th:selected="${query.pageSize == 3}">3</option>
                <option th:value="6" th:selected="${query.pageSize == 6}">6</option>
                <option th:value="9" th:selected="${query.pageSize == 9}">9</option>
            </select>
            <span>per page</span>

            <!-- Hidden inputs -->
            <input type="hidden" name="pageNumber" th:value="${query.pageNumber}" />
            <input type="hidden" name="sortBy" th:value="${query.sortBy}" />
            <input type="hidden" name="sortDirection" th:value="${query.sortDirection}" />
        </div>

        <!-- Pagination links -->
        <div class="col-md-8 text-end">
            <nav class="d-flex justify-content-end mt-2">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${query.pageNumber == 0} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/promotions(pageNumber=${query.pageNumber - 1}, pageSize=${query.pageSize}, sortBy=${query.sortBy}, sortDirection=${query.sortDirection})}">Previous</a>
                    </li>

                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == query.pageNumber} ? 'active'">
                        <a class="page-link"
                           th:href="@{/promotions(pageNumber=${i}, pageSize=${query.pageSize}, sortBy=${query.sortBy}, sortDirection=${query.sortDirection})}"
                           th:text="${i + 1}">1</a>
                    </li>

                    <li class="page-item" th:classappend="${query.pageNumber + 1 >= totalPages} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/promotions(pageNumber=${query.pageNumber + 1}, pageSize=${query.pageSize}, sortBy=${query.sortBy}, sortDirection=${query.sortDirection})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function() {
        const toggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('appSidebar');
        const body = document.querySelector('body');

        if (!sidebar) return;
        const savedState = localStorage.getItem("sidebar-collapsed") === "true";

        function setCollapsed(collapsed) {
            if (collapsed) {
                sidebar.classList.add('sidebar-collapsed');
                body.classList.remove('content-with-sidebar');
                body.classList.add('content-no-sidebar');
            } else {
                sidebar.classList.remove('sidebar-collapsed');
                body.classList.remove('content-no-sidebar');
                body.classList.add('content-with-sidebar');
            }
            try { localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0'); } catch(e) {}
        }

        const saved = localStorage.getItem('sidebarCollapsed');
        setCollapsed(saved === '1');

        if (toggle) {
            toggle.addEventListener('click', function () {
                const isCollapsed = sidebar.classList.contains('sidebar-collapsed');
                setCollapsed(!isCollapsed);
            });
        }

        // close sidebar on small screens when clicking outside
        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 991.98) {
                if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
                    setCollapsed(true);
                }
            }
        });
    })();
</script>
</body>
</html>
