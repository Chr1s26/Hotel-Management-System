<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register Editor | Hotel Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center py-10 px-4">

<h2 class="text-3xl font-bold text-gray-800 mb-6">Editor Registration</h2>

<div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-lg">
    <form th:action="@{/register/editor}" method="post" th:object="${editor}" class="space-y-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div>
            <label class="block text-sm font-medium text-gray-700">Username</label>
            <input type="text" th:field="*{user.name}" class="w-full px-4 py-2 border rounded" required />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" th:field="*{user.email}" class="w-full px-4 py-2 border rounded" required />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Phone</label>
            <input type="text" th:field="*{user.phone}" class="w-full px-4 py-2 border rounded" required />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" th:field="*{user.password}" class="w-full px-4 py-2 border rounded" required />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Date of Birth</label>
            <input type="date" th:field="*{user.dateOfBirth}" class="w-full px-4 py-2 border rounded" required />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Nationality</label>
            <input type="text" th:field="*{user.nationality}" class="w-full px-4 py-2 border rounded" required />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Passport Number</label>
            <input type="text" th:field="*{passportNumber}" class="w-full px-4 py-2 border rounded" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">National ID Number</label>
            <input type="text" th:field="*{nationalIdNumber}" class="w-full px-4 py-2 border rounded" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Editor Type</label>
            <select th:field="*{editorType}" class="w-full px-4 py-2 border rounded" required>
                <option th:value="ImageEditor">ImageEditor</option>
                <option th:value="RoomEditor">RoomEditor</option>
                <option th:value="HotelEditor">HotelEditor</option>
            </select>
        </div>

        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded">Register Editor</button>
    </form>
</div>

</body>
</html>
