<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Policy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #2E4053; /* Dark gray background */
            color: white;              /* White text globally */
            padding-top: 70px;
        }
        form {
            background-color: #6E6E6E; /* Slightly lighter gray for form background */
            padding: 20px;
            border-radius: 8px;
        }
        label.form-label {
            color: white; /* Ensure labels are white */
        }
        .form-control, .form-select {
            background-color: #7F7F7F; /* Medium gray input background */
            color: white;              /* White text inside inputs */
            border: 1px solid #999;
        }
        .form-control:focus, .form-select:focus {
            background-color: #8F8F8F; /* Slightly lighter on focus */
            color: white;
            border-color: #ccc;
            box-shadow: none;
        }
        .text-danger {
            color: #FF6B6B; /* Keep error text red for visibility */
        }
        .btn-primary {
            background-color: #555555; /* Dark gray button */
            border-color: #555555;
            color: white;
        }
        .btn-primary:hover {
            background-color: #777777;
            border-color: #777777;
            color: white;
        }
        .btn-secondary {
            background-color: #333333; /* Even darker gray */
            border-color: #333333;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #555555;
            border-color: #555555;
            color: white;
        }
    </style>
</head>
<body class="container mt-4">
<div th:replace="fragments/navbar :: navbar"></div>
<h2>Update Policy</h2>
<form th:action="@{/policies/update/{id}(id=${policy.id})}" th:object="${policy}" method="post" class="needs-validation">
    <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" th:field="*{title}" class="form-control"/>
        <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
    </div>
    <div class="mb-3">
        <label class="form-label">Description</label>
        <input type="text" th:field="*{description}" class="form-control"/>
        <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
    </div>
    <div class="mb-3">
        <label class="form-label">Applicable To</label>
        <input type="text" th:field="*{applicableTo}" class="form-control"/>
        <div class="text-danger" th:if="${#fields.hasErrors('applicableTo')}" th:errors="*{applicableTo}"></div>
    </div>

    <button type="submit" class="btn btn-primary">Update Policy</button>
    <a class="btn btn-secondary" th:href="@{/policies}">Cancel</a>
</form>
</body>
</html>
