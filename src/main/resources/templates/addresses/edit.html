<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Address</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #2E4053; /* Dark gray background */
            color: white;              /* White text globally */
        }
        form {
            background-color: #6E6E6E; /* Slightly lighter gray for form background */
            padding: 20px;
            border-radius: 8px;
        }
        label.form-label {
            color: white; /* Ensure labels are white */
        }
        .form-control, .form-select {
            background-color: #7F7F7F; /* Medium gray input background */
            color: white;              /* White text inside inputs */
            border: 1px solid #999;
        }
        .form-control:focus, .form-select:focus {
            background-color: #8F8F8F; /* Slightly lighter on focus */
            color: white;
            border-color: #ccc;
            box-shadow: none;
        }
        .text-danger {
            color: #FF6B6B; /* Keep error text red for visibility */
        }
        .btn-primary {
            background-color: #555555; /* Dark gray button */
            border-color: #555555;
            color: white;
        }
        .btn-primary:hover {
            background-color: #777777;
            border-color: #777777;
            color: white;
        }
        .btn-secondary {
            background-color: #333333; /* Even darker gray */
            border-color: #333333;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #555555;
            border-color: #555555;
            color: white;
        }
    </style>
</head>
<body class="container mt-4">
<h2>Update Address</h2>
<form th:action="@{/addresses/update/{id}(id=${address.id})}" th:object="${address}" method="post" class="needs-validation">
    <div class="mb-3">
        <label class="form-label">Road</label>
        <input type="text" th:field="*{road}" class="form-control"/>
        <div class="text-danger" th:if="${#fields.hasErrors('road')}" th:errors="*{road}"></div>
    </div>
    <div class="mb-3">
        <label class="form-label">Latitude</label>
        <input type="text" th:field="*{latitude}" class="form-control"/>
        <div class="text-danger" th:if="${#fields.hasErrors('latitude')}" th:errors="*{latitude}"></div>
    </div>
    <div class="mb-3">
        <label class="form-label">Longitude</label>
        <input type="text" th:field="*{longitude}" class="form-control"/>
        <div class="text-danger" th:if="${#fields.hasErrors('longitude')}" th:errors="*{longitude}"></div>
    </div>
    <div class="mb-3">
        <label class="form-label">Cities</label>
        <select id="city-select" th:field="*{city.id}" class="form-select" required>
            <option value="" disabled selected>-- Select City --</option>
            <option th:each="city : ${cities}"
                    th:value="${city.id}"
                    th:text="${city.name}">
            </option>
        </select>
        <div class="text-danger" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
    </div>
    <div class="mb-3">
        <label class="form-label">Zip Code</label>
        <input type="text" th:field="*{zipCode}" class="form-control"/>
        <div class="text-danger" th:if="${#fields.hasErrors('zipCode')}" th:errors="*{zipCode}"></div>
    </div>
    <button type="submit" class="btn btn-primary">Update Address</button>
    <a class="btn btn-secondary" th:href="@{/addresses}">Cancel</a>
</form>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
    $(document).ready(function() {
        $('#city-select').select2({
            placeholder: "Select or type a city",
            allowClear: true,
            width: '100%'
        });
    });
</script>
</body>
</html>
