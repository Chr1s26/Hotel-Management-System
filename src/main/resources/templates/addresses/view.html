<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Address View</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/form-theme.css}">
</head>

<body class="royal-form-page">
<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="container mt-4">
    <h2 class="page-title" th:text="${address.id}">Address ID</h2>

    <!-- Tabs Navigation -->
    <ul class="nav nav-tabs mb-3" id="addressTabs" role="tablist">
        <li class="nav-item">
            <a class="nav-link active" id="home-tab" data-bs-toggle="tab" href="#home" role="tab">Home</a>
        </li>
    </ul>

    <div class="tab-content" id="addressTabsContent">
        <!-- Home Tab -->
        <div class="tab-pane fade show active" id="home" role="tabpanel">
            <div class="glass-card p-4 mb-4">
                <h4 class="text-bluegray mb-3">Address Information</h4>
                <p><strong>Address ID: </strong><span th:text="${address.id}"></span></p>
                <p><strong>Latitude: </strong><span th:text="${address.latitude}"></span></p>
                <p><strong>Longitude:</strong> <span th:text="${address.longitude}"></span></p>
                <p><strong>Road: </strong><span th:text="${address.road}"></span></p>
                <p><strong>City: </strong><span th:text="${address.city}"></span></p>
                <p><strong>ZipCode: </strong><span th:text="${address.zipCode}"></span></p>
                <p><strong>Created At: </strong> <span th:text="${address.createdAt}"></span></p>
                <p><strong>Updated At: </strong><span th:text="${address.updatedAt}"></span></p>
                <p><strong>Created By:</strong> <span th:text="${address.createdBy}"></span></p>
                <p><strong>Updated By: </strong><span th:text="${address.updatedBy}"></span></p>
                <p></p>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/addresses}" class="btn btn-secondary">
            Back
        </a>
    </div>

</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function() {
        const toggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('appSidebar');
        const body = document.querySelector('body');

        if (!sidebar) return;
        const savedState = localStorage.getItem("sidebar-collapsed") === "true";

        function setCollapsed(collapsed) {
            if (collapsed) {
                sidebar.classList.add('sidebar-collapsed');
                body.classList.remove('content-with-sidebar');
                body.classList.add('content-no-sidebar');
            } else {
                sidebar.classList.remove('sidebar-collapsed');
                body.classList.remove('content-no-sidebar');
                body.classList.add('content-with-sidebar');
            }
            try { localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0'); } catch(e) {}
        }

        const saved = localStorage.getItem('sidebarCollapsed');
        setCollapsed(saved === '1');

        if (toggle) {
            toggle.addEventListener('click', function () {
                const isCollapsed = sidebar.classList.contains('sidebar-collapsed');
                setCollapsed(!isCollapsed);
            });
        }

        // close sidebar on small screens when clicking outside
        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 991.98) {
                if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
                    setCollapsed(true);
                }
            }
        });
    })();
</script>
</body>
</html>
