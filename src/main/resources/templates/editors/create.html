<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Editor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/form-theme.css}">
</head>

<body class="royal-form-page">
<div class="container mt-4">
    <h2 class="page-title">Create Editor</h2>
    <form th:action="@{/editors/create}" th:object="${editor}" method="post" class="needs-validation glass-form">
        <div class="accordion royal-accordion" id="editorAccordion">

            <div class="accordion-item">
                <h2 class="accordion-header" id="headingBasic">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseBasic" aria-expanded="true" aria-controls="collapseBasic">
                        Basic Information
                    </button>
                </h2>
                <div id="collapseBasic" class="accordion-collapse collapse show" aria-labelledby="headingBasic" data-bs-parent="#editorAccordion">
                    <div class="accordion-body">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" th:field="*{name}" class="form-control"/>
                            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" th:field="*{phone}" class="form-control"/>
                            <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Date of Birth</label>
                            <input type="date" th:field="*{dateOfBirth}" class="form-control"/>
                            <div class="text-danger" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nationality</label>
                            <input type="text" th:field="*{nationality}" class="form-control"/>
                            <div class="text-danger" th:if="${#fields.hasErrors('nationality')}" th:errors="*{nationality}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="accordion-item">
                <h2 class="accordion-header" id="headingIdentification">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseIdentification" aria-expanded="false" aria-controls="collapseIdentification">
                        Identification Details
                    </button>
                </h2>
                <div id="collapseIdentification" class="accordion-collapse collapse" aria-labelledby="headingIdentification" data-bs-parent="#editorAccordion">
                    <div class="accordion-body">
                        <div class="mb-3">
                            <label class="form-label">Passport Number</label>
                            <input type="text" th:field="*{passportNumber}" class="form-control"/>
                            <div class="text-danger" th:if="${#fields.hasErrors('passportNumber')}" th:errors="*{passportNumber}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">National ID Number</label>
                            <input type="text" th:field="*{nationalIdNumber}" class="form-control"/>
                            <div class="text-danger" th:if="${#fields.hasErrors('nationalIdNumber')}" th:errors="*{nationalIdNumber}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="accordion-item">
                <h2 class="accordion-header" id="headingType">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseType" aria-expanded="false" aria-controls="collapseType">
                        Editor Type
                    </button>
                </h2>
                <div id="collapseType" class="accordion-collapse collapse" aria-labelledby="headingType" data-bs-parent="#editorAccordion">
                    <div class="accordion-body">
                        <div class="mb-3">
                            <label class="form-label">Editor Type</label>
                            <select th:field="*{editorType}" class="form-select">
                                <option value="">-- Select Editor Type --</option>
                                <option th:each="type : ${T(com.project.HotelManagementSystem.entity.constants.EditorType).values()}"
                                        th:value="${type}"
                                        th:text="${type}"></option>
                            </select>
                            <div class="text-danger" th:if="${#fields.hasErrors('editorType')}" th:errors="*{editorType}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">User Account</label>
                            <select th:field="*{user}" class="form-select">
                                <option value="">-- Select User --</option>
                                <option th:each="user : ${users}"
                                        th:value="${user.id}"
                                        th:text="${user.name + ' (' + user.email + ')'}"></option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4 text-center">
            <button type="submit" class="btn btn-primary">Save</button>
            <a class="btn btn-secondary" th:href="@{/editors}">Cancel</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
</body>
</html>
