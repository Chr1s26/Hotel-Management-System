<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Region List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/form-theme.css}">
</head>
<body class="royal-form-page">
<div th:replace="fragments/sidebar :: sidebar"></div>
<div class="container mt-4">
    <h2>Regions</h2>

    <form th:action="@{/regions}" method="get" class="row g-3 align-items-end mb-4 no-card">

        <div class="col-md-3">
            <label for="searchName" class="form-label">Name</label>
            <input type="text" id="searchName" name="name" class="form-control"
                   th:value="${param.name}" placeholder="Search by name">
        </div>

        <div class="col-md-3">
            <label for="searchCountry" class="form-label">Country</label>
            <input type="text" id="searchCountry" name="countryName" class="form-control"
                   th:value="${param.countryName}" placeholder="Search by country name">
        </div>

        <div class="col-md-3 d-flex align-items-end">
            <button type="submit" class="btn btn-primary me-2">Search</button>
            <a th:href="@{/regions}" class="btn btn-secondary">Reset</a>
        </div>
    </form>

    <a th:href="@{/regions/export/excel}" class="btn btn-primary mb-3">
        <i class="bi bi-file-earmark-excel"></i> Export to Excel
    </a>

    <div class="d-flex justify-content-between align-items-center my-3">

        <div>
            Page <span th:text="${response.pageNumber + 1}">1</span> of
            <span th:text="${response.totalPages}">X</span> —
            Total: <span th:text="${response.totalElements}">Y</span> regions
        </div>


        <div>
            <a class="btn btn-primary btn-lg" th:href="@{/regions/new}">Add Regions</a>
        </div>
    </div>

    <table class="table table-bordered">
        <thead>
        <tr><th>ID</th><th>Name</th><th>Country</th><th>ACTIONS</th></tr>
        </thead>
        <tbody>
        <tr th:each="reg : ${regions}">
            <td th:text="${reg.id}"></td>
            <td th:text="${reg.name}"></td>
            <td th:text="${reg.country}"></td>

            <td>
                <a class="btn btn-sm btn-warning" th:href="@{'/regions/edit/' + ${reg.id}}">Edit</a>
                <a class="btn btn-sm btn-danger" th:href="@{'/regions/delete/' + ${reg.id}}">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <form th:action="@{/regions}" method="get" class="row align-items-center justify-content-between mt-4 mb-3 no-card">
        <!-- Page size selector -->
        <div class="col-md-4">
            <label for="pageSize" class="form-label">Show</label>
            <select id="pageSize" class="form-select d-inline w-auto" name="pageSize" onchange="this.form.submit()">
                <option th:value="3" th:selected="${response.pageSize == 3}">3</option>
                <option th:value="6" th:selected="${response.pageSize == 6}">6</option>
                <option th:value="9" th:selected="${response.pageSize == 9}">9</option>
            </select>
            <span>per page</span>

            <!-- Hidden inputs -->
            <input type="hidden" name="pageNumber" th:value="${response.pageNumber}" />
            <input type="hidden" name="sortBy" th:value="${sortBy}" />
            <input type="hidden" name="sortOrder" th:value="${sortOrder}" />
        </div>

        <!-- Pagination links -->
        <div class="col-md-8 text-end">
            <nav class="d-flex justify-content-end mt-2">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${response.pageNumber == 0} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/regions(pageNumber=${response.pageNumber - 1}, pageSize=${response.pageSize}, sortBy=${sortBy}, sortOrder=${sortOrder})}">Previous</a>
                    </li>

                    <li class="page-item" th:each="i : ${#numbers.sequence(0, response.totalPages - 1)}"
                        th:classappend="${i == response.pageNumber} ? 'active'">
                        <a class="page-link"
                           th:href="@{/regions(pageNumber=${i}, pageSize=${response.pageSize}, sortBy=${sortBy}, sortOrder=${sortOrder})}"
                           th:text="${i + 1}">1</a>
                    </li>

                    <li class="page-item" th:classappend="${response.pageNumber + 1 >= response.totalPages} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/regions(pageNumber=${response.pageNumber + 1}, pageSize=${response.pageSize}, sortBy=${sortBy}, sortOrder=${sortOrder})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function() {
        const toggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('appSidebar');
        const body = document.querySelector('body');

        if (!sidebar) return;
        const savedState = localStorage.getItem("sidebar-collapsed") === "true";

        function setCollapsed(collapsed) {
            if (collapsed) {
                sidebar.classList.add('sidebar-collapsed');
                body.classList.remove('content-with-sidebar');
                body.classList.add('content-no-sidebar');
            } else {
                sidebar.classList.remove('sidebar-collapsed');
                body.classList.remove('content-no-sidebar');
                body.classList.add('content-with-sidebar');
            }
            try { localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0'); } catch(e) {}
        }

        const saved = localStorage.getItem('sidebarCollapsed');
        setCollapsed(saved === '1');

        if (toggle) {
            toggle.addEventListener('click', function () {
                const isCollapsed = sidebar.classList.contains('sidebar-collapsed');
                setCollapsed(!isCollapsed);
            });
        }

        // close sidebar on small screens when clicking outside
        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 991.98) {
                if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
                    setCollapsed(true);
                }
            }
        });
    })();
</script>
</body>
</html>
